<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LatAm Invest Terminal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Heebo', sans-serif;
      background-color: #0B0F14;
      color: #E2E8F0;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0B0F14; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const supabaseUrl = 'https://oikogvyjchqjwxfembcd.supabase.co';
    const supabaseKey = 'sb_publishable_wfndEaEpiSiJ0ogGOmqF8g_XGvOx1h4';

    const urlParams = new URLSearchParams(window.location.search);
    const sharedEditionId = urlParams.get('edition');
    const isSharedView = Boolean(sharedEditionId) || urlParams.get('view') === 'share';

    const IconInfo = () => (
      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    const IconLock = () => (
      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    );
    const IconShare = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
      </svg>
    );
    const IconBuilding = () => (
      <svg className="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
    );
    const IconTrendUp = () => (
      <svg className="w-4 h-4 text-[#B2FF05]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    );
    const IconNews = () => (
      <svg className="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
      </svg>
    );
    const IconSearch = () => (
      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );
    const IconExternal = () => (
      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    );
    const IconClose = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const COUNTRIES = [
      { id: 'הכל', label: 'כל המדינות' },
      { id: 'מקסיקו', label: 'מקסיקו' },
      { id: 'קולומביה', label: 'קולומביה' },
      { id: "צ'ילה", label: "צ'ילה" },
      { id: 'ארגנטינה', label: 'ארגנטינה' },
      { id: 'פרו', label: 'פרו' },
      { id: 'אורוגוואי', label: 'אורוגוואי' },
      { id: 'אקוודור', label: 'אקוודור' },
      { id: 'קוסטה ריקה', label: 'קוסטה ריקה' },
      { id: 'אל סלבדור', label: 'אל סלבדור' }
    ];

    const STAGES = [
      { id: 'הכל', label: 'הכל', color: 'bg-gray-400' },
      { id: 'לקראת הנפקה', label: 'לקראת הנפקה', color: 'bg-purple-500' },
      { id: 'אחרי הנפקה', label: 'אחרי הנפקה', color: 'bg-blue-500' },
      { id: 'טרנדיות', label: 'טרנדיות', color: 'bg-lime-400' },
      { id: 'מומנטום', label: 'מומנטום', color: 'bg-orange-500' },
      { id: 'חזקות', label: 'חזקות', color: 'bg-teal-500' }
    ];

    const Tooltip = ({ text, children, position = 'bottom' }) => {
      const positionClasses = position === 'top' 
        ? "bottom-full left-1/2 -translate-x-1/2 mb-2.5" 
        : "top-full left-1/2 -translate-x-1/2 mt-2.5";
        
      const arrowClasses = position === 'top'
        ? "top-full left-1/2 -translate-x-1/2 -mt-1.5 border-b border-r transform rotate-45"
        : "bottom-full left-1/2 -translate-x-1/2 -mb-1.5 border-t border-l transform rotate-45";

      return (
        <div className="relative group inline-flex items-center gap-1.5 cursor-help">
          {children}
          <span className="text-gray-500 group-hover:text-[#B2FF05] transition-colors">
            <IconInfo />
          </span>
          <div className={`absolute ${positionClasses} hidden group-hover:block w-64 p-3 bg-[#1A232E] text-gray-200 text-xs rounded-xl shadow-2xl z-[100] border border-[#2D3A4B] font-normal normal-case text-right whitespace-normal leading-relaxed pointer-events-none`}>
            {text}
            <div className={`absolute ${arrowClasses} w-2.5 h-2.5 bg-[#1A232E] border-[#2D3A4B]`}></div>
          </div>
        </div>
      );
    };

    const getStageBadge = (stage) => {
      switch (stage) {
        case 'לקראת הנפקה': return 'bg-purple-500/15 text-purple-300 border-purple-500/30';
        case 'אחרי הנפקה': return 'bg-blue-500/15 text-blue-300 border-blue-500/30';
        case 'טרנדיות': return 'bg-lime-400/15 text-[#B2FF05] border-lime-400/30';
        case 'מומנטום': return 'bg-orange-500/15 text-orange-300 border-orange-500/30';
        case 'חזקות': return 'bg-teal-500/15 text-teal-300 border-teal-500/30';
        default: return 'bg-gray-500/15 text-gray-300 border-gray-500/30';
      }
    };

    const getInitials = (name) => {
      if (!name) return 'CO';
      return name.replace(/[^a-zA-Z0-9]/g, '').substring(0, 2).toUpperCase() || 'CO';
    };

    const parseMediaScore = (level) => {
      if (!level) return 65;
      if (!isNaN(Number(level))) return Number(level);
      if (level.includes('גבוה מאוד')) return 91;
      if (level.includes('גבוה')) return 82;
      if (level.includes('עלייה')) return 76;
      if (level.includes('בינוני')) return 64;
      return 55;
    };

    const deriveStage = (item) => {
      const status = (item.status || '').toLowerCase();
      const level = item.interest_level || '';
      
      if (status.includes('אחרי הנפקה')) return 'אחרי הנפקה';
      if (status.includes('לקראת הנפקה')) return 'לקראת הנפקה';
      if (status.includes('nyse') || status.includes('nasdaq') || status.includes('בורסאית') || status.includes('bmv') || status.includes('bcs') || status.includes(':')) {
        return 'חזקות';
      }
      if (level.includes('גבוה מאוד') || level.includes('גבוה')) return 'טרנדיות';
      if (level.includes('עלייה')) return 'מומנטום';
      return 'חזקות';
    };

    const isNonTraded = (company) => {
      const status = (company.status || '').toLowerCase();
      if (
        status.includes('לקראת הנפקה') ||
        status.includes('אחרי הנפקה') ||
        status.includes('nyse') ||
        status.includes('nasdaq') ||
        status.includes('בורסאית') ||
        status.includes('bmv') ||
        status.includes('bcs') ||
        status.includes(':')
      ) {
        return false;
      }
      return true;
    };

    const formatEditionDisplay = (slug) => {
      if (!slug) return '';
      const datePart = slug.split('_')[0];
      const [y, m, d] = datePart.split('-');
      return (d && m && y) ? `${d}.${m}.${y}` : slug;
    };

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [editionDateDisplay, setEditionDateDisplay] = useState(null);
      const [selectedCountry, setSelectedCountry] = useState('הכל');
      const [selectedStage, setSelectedStage] = useState('הכל');
      const [selectedCompany, setSelectedCompany] = useState(null);
      const [copied, setCopied] = useState(false);
      const [isCreatingSnapshot, setIsCreatingSnapshot] = useState(false);

      useEffect(() => {
        async function fetchData() {
          setLoading(true);
          try {
            let fetched = [];

            if (sharedEditionId) {
              const edRes = await fetch(
                `${supabaseUrl}/rest/v1/latam_editions?edition_id=eq.${encodeURIComponent(sharedEditionId)}&select=*`,
                {
                  headers: {
                    'apikey': supabaseKey,
                    'Authorization': `Bearer ${supabaseKey}`
                  }
                }
              );
              const edData = edRes.ok ? await edRes.json() : [];
              if (Array.isArray(edData) && edData.length > 0 && Array.isArray(edData[0].snapshot_data)) {
                fetched = edData[0].snapshot_data;
                setEditionDateDisplay(formatEditionDisplay(sharedEditionId));
              }
            }

            if (fetched.length === 0 && !sharedEditionId) {
              const response = await fetch(`${supabaseUrl}/rest/v1/latam_companies?select=*&order=id.desc`, {
                headers: {
                  'apikey': supabaseKey,
                  'Authorization': `Bearer ${supabaseKey}`
                }
              });
              const dbData = response.ok ? await response.json() : [];
              fetched = Array.isArray(dbData) ? dbData : [];

              if (fetched.length > 0) {
                const newest = fetched.reduce((acc, curr) => {
                  const dateVal = curr.updated_at || curr.created_at;
                  if (!dateVal) return acc;
                  return new Date(dateVal) > new Date(acc) ? dateVal : acc;
                }, fetched[0].updated_at || fetched[0].created_at || new Date().toISOString());

                setEditionDateDisplay(new Date(newest).toLocaleDateString('he-IL', {
                  day: '2-digit',
                  month: '2-digit',
                  year: 'numeric'
                }));
              }
            }

            const validCountries = COUNTRIES.map(c => c.id);
            const enrichedDB = fetched
              .filter(item => 
                validCountries.includes(item.country) && 
                !item.name?.toLowerCase().includes('amazon') &&
                !item.name?.toLowerCase().includes('frubana')
              )
              .map(item => {
                const score = parseMediaScore(item.interest_level);
                const computedStage = deriveStage(item);
                return {
                  ...item,
                  sector: item.industry || 'פינטק וטכנולוגיה',
                  stage: computedStage,
                  interest_num: score,
                  driver_type: item.motivation || 'כסף ותשואה (קר)',
                  description: item.description || `${item.name} היא חברת ${item.industry || 'טכנולוגיה'} מובילה הפועלת ב${item.country} ומספקת פתרונות דיגיטליים מתקדמים לשוק המקומי.`,
                  investment_thesis: item.investment_thesis || `החברה נהנית מאימוץ דיגיטלי מואץ ב${item.country} ומבססת את מעמדה כאחת השחקניות הבולטות בסקטור.`
                };
              })
              .sort((a, b) => b.interest_num - a.interest_num);

            setData(enrichedDB);
          } catch (err) {
            console.error("Fetch error:", err);
          } finally {
            setLoading(false);
          }
        }
        fetchData();
      }, []);

      const filteredData = useMemo(() => {
        return data.filter(item => {
          const matchCountry = selectedCountry === 'הכל' || item.country === selectedCountry;
          const matchStage = selectedStage === 'הכל' || item.stage === selectedStage;
          return matchCountry && matchStage;
        });
      }, [data, selectedCountry, selectedStage]);

      const handleCreateNewFrozenLink = async () => {
        setIsCreatingSnapshot(true);
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const uniqueSuffix = Math.random().toString(36).substring(2, 6);
        const uniqueEditionSlug = `${dateStr}_${uniqueSuffix}`;

        try {
          const res = await fetch(`${supabaseUrl}/rest/v1/latam_editions`, {
            method: 'POST',
            headers: {
              'apikey': supabaseKey,
              'Authorization': `Bearer ${supabaseKey}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              edition_id: uniqueEditionSlug,
              snapshot_data: data
            })
          });

          if (!res.ok) {
            const errText = await res.text();
            alert(`שגיאה בשמירת המהדורה ב-Supabase (${res.status}): ודא שטבלת latam_editions קיימת ושה-RLS כבוי עליה.\nפרטים: ${errText}`);
            setIsCreatingSnapshot(false);
            return;
          }

          const baseUrl = window.location.origin + window.location.pathname;
          const shareUrl = `${baseUrl}?edition=${uniqueEditionSlug}`;
          await navigator.clipboard.writeText(shareUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 3500);
        } catch (e) {
          alert(`שגיאת תקשורת ביצירת הקישור: ${e.message}`);
        } finally {
          setIsCreatingSnapshot(false);
        }
      };

      const stageTooltips = {
        'טרנדיות': 'חברות פרטיות או ציבוריות שמייצרות סיקור תקשורתי ורעש ברשת כרגע.',
        'מומנטום': 'חברות שנמצאות במסלול צמיחה עקבי בהכנסות ובגיוסי הון.',
        'לקראת הנפקה': 'חברות פרטיות שקיים לגביהן דיווח רשמי ופומבי על הגשת תשקיף או תכנון IPO קרוב.',
        'אחרי הנפקה': 'חברות טכנולוגיה ופינטק שהונפקו בבורסה ב-3 השנים האחרונות.',
        'חזקות': 'חברות עוגן מבוססות ובורסאיות ותיקות עם נתח שוק משמעותי.'
      };

      return (
        <div className="min-h-screen bg-[#0B0F14] text-gray-200 pb-16">
          <header className="border-b border-[#1E2732] bg-[#0E131A]/90 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <div className="flex items-center gap-3 flex-wrap">
                  <div className="w-3 h-3 rounded-full bg-[#B2FF05] shadow-[0_0_12px_#B2FF05]"></div>
                  <h1 className="text-xl font-black tracking-tight text-white">
                    LATAM <span className="text-[#B2FF05]">INVEST</span> TERMINAL
                  </h1>
                  {sharedEditionId && (
                    <span className="inline-flex items-center gap-1.5 text-[11px] bg-[#18212C] text-[#B2FF05] border border-[#B2FF05]/40 px-2.5 py-0.5 rounded-full font-medium">
                      <IconLock />
                      מהדורה נעולה: {editionDateDisplay}
                    </span>
                  )}
                </div>
                <p className="text-xs text-gray-400 mt-1">
                  סקירת שוק ומודיעין עסקי לשווקים מתעוררים באמריקה הלטינית {editionDateDisplay ? `• מהדורת ${editionDateDisplay}` : ''}
                </p>
              </div>

              {!isSharedView && (
                <div className="flex items-center gap-3">
                  <button 
                    onClick={handleCreateNewFrozenLink}
                    disabled={isCreatingSnapshot || data.length === 0}
                    className="bg-[#B2FF05] hover:bg-[#a1e604] disabled:opacity-50 text-[#0B0F14] px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition-all shadow-[0_0_15px_rgba(178,255,5,0.2)]"
                  >
                    <IconShare />
                    {isCreatingSnapshot 
                      ? 'נועל גרסה חדשה...' 
                      : copied 
                      ? 'הקישור הקפוא הועתק! (מוכן לשליחה)' 
                      : 'צור והעתק קישור קפוא למצב הנוכחי'}
                  </button>
                </div>
              )}
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 space-y-6">
            <div className="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar">
              {COUNTRIES.map(country => {
                const count = country.id === 'הכל' 
                  ? data.length 
                  : data.filter(d => d.country === country.id).length;
                
                return (
                  <button
                    key={country.id}
                    onClick={() => setSelectedCountry(country.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center gap-2 border ${
                      selectedCountry === country.id
                        ? 'bg-[#B2FF05] text-[#0B0F14] border-[#B2FF05] font-bold shadow-[0_0_15px_rgba(178,255,5,0.2)]'
                        : 'bg-[#131A22] text-gray-400 border-[#232D36] hover:border-gray-600 hover:text-gray-200'
                    }`}
                  >
                    <span>{country.label}</span>
                    <span className={`px-1.5 py-0.5 rounded-md text-[10px] ${
                      selectedCountry === country.id ? 'bg-black/20 text-black' : 'bg-[#1C2530] text-gray-400'
                    }`}>
                      {count}
                    </span>
                  </button>
                );
              })}
            </div>

            <div className="flex flex-wrap items-center gap-2 bg-[#11171F] p-4 rounded-2xl border border-[#1E2732]">
              {STAGES.map(stage => {
                const btn = (
                  <button
                    key={stage.id}
                    onClick={() => setSelectedStage(stage.id)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2 border ${
                      selectedStage === stage.id
                        ? 'bg-[#1A232E] text-white border-[#B2FF05]/50 shadow-[0_0_10px_rgba(178,255,5,0.1)]'
                        : 'bg-[#131A22] text-gray-400 border-[#232D36] hover:border-gray-600'
                    }`}
                  >
                    <span className={`w-2 h-2 rounded-full ${stage.color}`}></span>
                    {stage.label}
                  </button>
                );

                return stageTooltips[stage.id] ? (
                  <Tooltip key={stage.id} text={stageTooltips[stage.id]} position="bottom">
                    {btn}
                  </Tooltip>
                ) : btn;
              })}
            </div>

            <div className="bg-[#11171F] border border-[#1E2732] rounded-2xl overflow-visible shadow-xl">
              <div className="overflow-x-auto overflow-y-visible">
                <table className="w-full text-right border-collapse">
                  <thead>
                    <tr className="border-b border-[#1E2732] text-gray-400 text-xs bg-[#141B24]">
                      <th className="py-4 px-4 font-medium min-w-[180px]">חברה</th>
                      <th className="py-4 px-3 font-medium whitespace-nowrap">מדינה</th>
                      <th className="py-4 px-3 font-medium min-w-[120px]">סקטור</th>
                      <th className="py-4 px-3 font-medium text-center whitespace-nowrap">
                        <Tooltip text="סיווג החברה: טרנדיות, מומנטום, לקראת הנפקה (דיווח רשמי בלבד), אחרי הנפקה או חברות עוגן חזקות." position="bottom">
                          שלב
                        </Tooltip>
                      </th>
                      <th className="py-4 px-3 font-medium whitespace-nowrap">
                        <Tooltip text="מדד עניין יחסי (0-100) המשקלל מגמות חיפוש ב-Google Trends והיקף סיקור תקשורתי ב-30 הימים האחרונים במדינת היעד." position="bottom">
                          עניין ומומנטום ↓
                        </Tooltip>
                      </th>
                      <th className="py-4 px-3 font-medium min-w-[110px]">המניע המרכזי</th>
                      <th className="py-4 px-3 font-medium min-w-[160px]">מה מדווחים עליה</th>
                      <th className="py-4 px-3 font-medium min-w-[160px]">הון שגויס</th>
                      <th className="py-4 px-4 font-medium min-w-[160px]">שווי מוערך</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#1E2732]/60 text-sm">
                    {loading ? (
                      <tr>
                        <td colSpan="9" className="py-16 text-center text-gray-500">
                          טוען נתוני מחקר...
                        </td>
                      </tr>
                    ) : filteredData.length === 0 ? (
                      <tr>
                        <td colSpan="9" className="py-16 text-center text-gray-500">
                          לא נמצאו חברות התואמות לסינון הנוכחי.
                        </td>
                      </tr>
                    ) : (
                      filteredData.map((company, idx) => {
                        const nonTraded = isNonTraded(company);
                        return (
                          <tr 
                            key={company.id || idx}
                            onClick={() => setSelectedCompany(company)}
                            className="hover:bg-[#17202B] transition-colors cursor-pointer group"
                          >
                            <td className="py-4 px-4">
                              <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-[#1A232E] border border-[#2A3644] flex items-center justify-center font-bold text-xs text-gray-300 group-hover:border-[#B2FF05]/50 group-hover:text-[#B2FF05] transition-colors shrink-0">
                                  {getInitials(company.name)}
                                </div>
                                <div>
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <span className="font-bold text-white group-hover:text-[#B2FF05] transition-colors">
                                      {company.name}
                                    </span>
                                    {nonTraded && (
                                      <span
                                        title="חברה פרטית ללא מניות סחירות וללא דיווח רשמי על הנפקה קרובה"
                                        className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-medium bg-[#18212C] text-gray-400 border border-[#2A3644] whitespace-nowrap"
                                      >
                                        <span className="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                                        לא נסחרת
                                      </span>
                                    )}
                                  </div>
                                  <div className="text-[11px] text-gray-500 flex items-center gap-1 mt-0.5">
                                    <span className="text-emerald-400">↗</span>
                                    <span>{company.status || 'פרטית • מקור מקומי (לא נסחרת)'}</span>
                                  </div>
                                </div>
                              </div>
                            </td>
                            <td className="py-4 px-3 text-gray-300 text-xs whitespace-nowrap">{company.country}</td>
                            <td className="py-4 px-3 text-gray-400 text-xs leading-snug">{company.sector}</td>
                            <td className="py-4 px-3 text-center whitespace-nowrap">
                              <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${getStageBadge(company.stage)}`}>
                                {company.stage}
                              </span>
                            </td>
                            <td className="py-4 px-3 whitespace-nowrap">
                              <div className="flex items-center gap-2">
                                <span className="font-bold text-white w-5">{company.interest_num}</span>
                                <div className="w-12 h-1.5 bg-[#1E2732] rounded-full overflow-hidden">
                                  <div 
                                    className="h-full bg-[#B2FF05] rounded-full" 
                                    style={{ width: `${Math.min(100, company.interest_num)}%` }}
                                  ></div>
                                </div>
                              </div>
                            </td>
                            <td className="py-4 px-3 text-gray-300 text-xs leading-snug">{company.driver_type}</td>
                            <td className="py-4 px-3 text-gray-400 text-xs max-w-[180px] truncate" title={company.catalyst}>
                              {company.catalyst || 'פעילות צומחת בשוק המקומי'}
                            </td>
                            <td className="py-4 px-3 text-gray-300 font-mono text-xs max-w-[200px] leading-snug break-words">
                              {company.raised || 'לא פורסם'}
                            </td>
                            <td className="py-4 px-4 font-bold text-white font-mono text-xs max-w-[200px] leading-snug break-words">
                              {company.valuation || 'לא פורסם'}
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {selectedCompany && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto"
              onClick={() => setSelectedCompany(null)}
            >
              <div 
                className="bg-[#0B0F14] border border-[#B2FF05]/40 rounded-2xl max-w-2xl w-full p-6 space-y-4 shadow-[0_0_40px_rgba(0,0,0,0.9)] relative my-8"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-start justify-between border-b border-[#1E2732] pb-4">
                  <button 
                    onClick={() => setSelectedCompany(null)}
                    className="text-gray-400 hover:text-white p-1.5 rounded-lg bg-[#161E27] transition-colors"
                  >
                    <IconClose />
                  </button>

                  <div className="text-left">
                    <div className="text-xs text-gray-400 mb-1">
                      פעילות ב{selectedCompany.country} • {selectedCompany.sector}
                    </div>
                    <div className="flex items-center justify-end gap-2.5 flex-wrap">
                      {isNonTraded(selectedCompany) && (
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-[#18212C] text-gray-400 border border-[#2A3644]">
                          <span className="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                          לא נסחרת
                        </span>
                      )}
                      <span className={`px-3 py-1 rounded-full text-xs font-medium border ${getStageBadge(selectedCompany.stage)}`}>
                        {selectedCompany.stage}
                      </span>
                      <span className="bg-[#B2FF05] text-[#0B0F14] px-3 py-0.5 rounded-lg text-xl font-black tracking-tight">
                        {selectedCompany.name}
                      </span>
                    </div>
                    <div className="text-xs text-gray-300 mt-1.5 font-mono">
                      {selectedCompany.status || 'פרטית (לא נסחרת)'}
                    </div>
                  </div>
                </div>

                <div className="bg-[#11171F] border border-[#1E2732] rounded-xl p-4 space-y-1.5">
                  <div className="flex items-center gap-2 text-xs text-gray-400 font-medium">
                    <IconBuilding />
                    <span>מה היא עושה</span>
                  </div>
                  <p className="text-sm text-gray-200 leading-relaxed">
                    {selectedCompany.description}
                  </p>
                </div>

                <div className="bg-[#11171F] border border-[#B2FF05]/50 rounded-xl p-4 space-y-1.5 shadow-[0_0_20px_rgba(178,255,5,0.05)]">
                  <div className="flex items-center gap-2 text-xs text-[#B2FF05] font-bold">
                    <IconTrendUp />
                    <span>למה שווה להשקיע</span>
                  </div>
                  <p className="text-sm text-white leading-relaxed">
                    {selectedCompany.investment_thesis}
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div className="bg-[#11171F] border border-[#1E2732] p-4 rounded-xl">
                    <div className="text-xs text-gray-400">הון שגויס (כולל שנה וסוג)</div>
                    <div className="text-sm font-black text-white mt-1.5 font-mono leading-relaxed">{selectedCompany.raised || 'לא פורסם'}</div>
                  </div>
                  <div className="bg-[#11171F] border border-[#1E2732] p-4 rounded-xl">
                    <div className="text-xs text-gray-400">שווי מוערך (כולל שנה)</div>
                    <div className="text-sm font-black text-[#B2FF05] mt-1.5 font-mono leading-relaxed">{selectedCompany.valuation || 'לא פורסם'}</div>
                  </div>
                </div>

                <div className="bg-[#11171F] border border-[#1E2732] rounded-xl p-4">
                  <div className="text-xs text-gray-400 mb-2">מדדים (Google Trends וסיקור 30 יום)</div>
                  <div className="flex items-center gap-4">
                    <span className="text-xs text-gray-300 font-medium">עניין ומומנטום</span>
                    <span className="text-sm font-bold text-white">{selectedCompany.interest_num}</span>
                    <div className="flex-1 h-2 bg-[#1E2732] rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-[#B2FF05] rounded-full" 
                        style={{ width: `${Math.min(100, selectedCompany.interest_num)}%` }}
                      ></div>
                    </div>
                  </div>
                </div>

                <div className="bg-[#11171F] border border-[#1E2732] rounded-xl p-4 space-y-2.5">
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <div className="flex items-center gap-2 text-xs text-gray-400 font-medium">
                      <IconNews />
                      <span>מה מדווחים עליה</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <a 
                        href={`https://www.google.com/search?q=${encodeURIComponent(`"${selectedCompany.name}" ${selectedCompany.country} funding valuation`)}`}
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="text-xs text-gray-300 hover:text-[#B2FF05] flex items-center gap-1 bg-[#18212C] px-2.5 py-1 rounded-lg border border-[#2A3644] transition-colors"
                      >
                        <IconSearch />
                        <span>אמת נתונים בגוגל</span>
                      </a>
                      {selectedCompany.source_url && (
                        <a 
                          href={selectedCompany.source_url} 
                          target="_blank" 
                          rel="noopener noreferrer"
                          className="text-xs text-[#B2FF05] hover:underline flex items-center gap-1 font-bold"
                        >
                          <span>לכתבת המקור</span>
                          <IconExternal />
                        </a>
                      )}
                    </div>
                  </div>
                  <p className="text-sm text-gray-200 leading-relaxed">
                    {selectedCompany.catalyst || 'פעילות צומחת בשוק המקומי.'}
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
