<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טבלת מחקר - LATAM</title>
  
  <!-- ספריות React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- עיצוב ואייקונים -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* עיצוב פס גלילה מותאם לדארק מוד */
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0a0f14; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #232D36; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3a4b5c; }
    body { background-color: #0a0f14; }
  </style>
</head>
<body class="text-gray-300 font-sans selection:bg-[#B2FF05] selection:text-black custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const supabaseUrl = 'https://oikogvyjchqjwxfembcd.supabase.co';
    const supabaseKey = 'sb_publishable_wfndEaEpiSiJ0ogGOmqF8g_XGvOx1h4';

    const COUNTRIES = [
      'הכל', 'ארגנטינה', 'צ\'ילה', 'קולומביה', 'מקסיקו', 
      'פרו', 'אורוגוואי', 'אקוודור', 'אל סלבדור', 'גואטמלה'
    ];

    const STAGES = [
      { id: 'הכל', label: 'הכל', color: 'bg-lime-400' },
      { id: 'לקראת הנפקה', label: 'לקראת הנפקה', color: 'bg-purple-500' },
      { id: 'טרנדיות', label: 'טרנדיות', color: 'bg-lime-400' },
      { id: 'חזקות', label: 'חזקות', color: 'bg-teal-500' },
      { id: 'מומנטום', label: 'מומנטום', color: 'bg-orange-500' }
    ];

    const getHash = (str) => {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      return Math.abs(hash);
    };

    const generateFallbacks = () => {
      const fallbacks = [];
      const industries = ['פינטק ואשראי', 'בנקאות', 'מסחר אלקטרוני', 'תשלומים', 'בנקאות לעסקים', 'רכב משומש', 'טלקום'];
      
      COUNTRIES.filter(c => c !== 'הכל').forEach(country => {
        for (let i = 1; i <= 5; i++) {
          const hash = getHash(`${country}-${i}`);
          const stage = STAGES[1 + (hash % 4)].id;
          
          fallbacks.push({
            id: `fb-${country}-${i}`,
            name: `חברה ${i} - ${country}`,
            ticker: `C${i}${country.substring(0,1).toUpperCase()}`,
            country: country,
            industry: industries[hash % industries.length],
            stage: stage,
            interest_num: 60 + (hash % 35),
            clicks: `${100 + (hash % 400)}K`,
            ad_spend: `$${50 + (hash % 250)}K`,
            raised: `$${100 + (hash % 900)}M`,
            valuation: `$${(1 + (hash % 20)).toFixed(1)}B`,
            growth: `+${20 + (hash % 80)}%`,
            exposure: 50 + (hash % 40),
            ad_metric: 60 + (hash % 35),
            description: 'בנק דיגיטלי שמנפיק כרטיסי אשראי ונותן הלוואות צרכניות, עם אפליקציה לניהול הוצאות מבוססת AI.',
            why_invest: 'גיוס ענק של מיליוני דולרים וצמיחה מהירה במספר הלקוחות. האפליקציה תופסת תאוצה בקרב צעירים.',
            feeling: 'תחושת פספוס (FOMO) – הקהל מרגיש שזו ההזדמנות האחרונה להיכנס מוקדם לפני הפריצה הגדולה.',
            money: 'הטיעון הוא סכום הכניסה — חשבון ראשון, אשראי ראשון, בלי היסטוריית אשראי קודמת.',
            ad_angle: 'כרטיס אשראי בלי עמלות — המסר שמייצר הכי הרבה תגובות ברשתות החברתיות.'
          });
        }
      });
      return fallbacks;
    };

    function App() {
      const [data, setData] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      
      const [selectedCountry, setSelectedCountry] = React.useState('הכל');
      const [selectedStage, setSelectedStage] = React.useState('הכל');
      const [selectedCompany, setSelectedCompany] = React.useState(null);

      React.useEffect(() => {
        async function fetchData() {
          setLoading(true);
          try {
            const response = await fetch(`${supabaseUrl}/rest/v1/latam_companies?select=*`, {
              headers: {
                'apikey': supabaseKey,
                'Authorization': `Bearer ${supabaseKey}`
              }
            });
            
            const dbData = response.ok ? await response.json() : [];
            let fetched = dbData || [];
            
            const enrichedDB = fetched.map(item => {
              const hash = getHash(item.name || item.id?.toString() || 'a');
              return {
                ...item,
                ticker: item.name ? item.name.substring(0,2).toUpperCase() : 'UNK',
                stage: STAGES[1 + (hash % 4)].id,
                interest_num: 65 + (hash % 30),
                clicks: item.clicks ? `${(item.clicks/1000).toFixed(0)}K` : `${150 + (hash % 300)}K`,
                ad_spend: `$${80 + (hash % 200)}K`,
                raised: item.investment_amount !== 'לא זמין פומבית' ? item.investment_amount : `$${200 + (hash % 500)}M`,
                valuation: `$${(2 + (hash % 15)).toFixed(1)}B`,
                growth: `+${30 + (hash % 60)}%`,
                exposure: 60 + (hash % 30),
                ad_metric: 70 + (hash % 25),
                description: item.description || 'פלטפורמה טכנולוגית פיננסית מובילה באזור.',
                why_invest: item.why_invest || 'מודל עסקי יציב עם צמיחה עקבית בשווקים מתפתחים.',
                feeling: item.motivation || 'חיבור רגשי חזק למותג מצד דור ה-Z.',
                money: 'הכנסות יציבות משירותי פרימיום ועמלות סליקה צולבות.',
                ad_angle: 'קמפיין ממוקד המדגיש את החיסכון בעמלות מול הבנקים המסורתיים.'
              };
            });

            const grouped = {};
            enrichedDB.forEach(d => {
              grouped[d.country] = (grouped[d.country] || 0) + 1;
            });

            const fallbacks = generateFallbacks();
            const finalData = [...enrichedDB];
            
            fallbacks.forEach(f => {
              if ((grouped[f.country] || 0) < 5) {
                finalData.push(f);
                grouped[f.country] = (grouped[f.country] || 0) + 1;
              }
            });

            setData(finalData);
          } catch (err) {
            console.error("Fetch error:", err);
          } finally {
            setLoading(false);
          }
        }
        fetchData();
      }, []);

      const filteredData = data.filter(item => {
        const matchCountry = selectedCountry === 'הכל' || item.country === selectedCountry;
        const matchStage = selectedStage === 'הכל' || item.stage === selectedStage;
        return matchCountry && matchStage;
      });

      const exportToExcel = async () => {
        if (data.length === 0) return;
        
        if (!window.XLSX) {
          await new Promise((resolve) => {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
            script.onload = resolve;
            document.head.appendChild(script);
          });
        }
        
        const XLSX = window.XLSX;
        const workbook = XLSX.utils.book_new();
        const allUniqueCountries = [...new Set(data.map(item => item.country))];
        
        allUniqueCountries.forEach(country => {
          const countryData = data.filter(item => item.country === country);
          const excelData = countryData.map(item => ({
            'שם החברה': item.name,
            'מדינה': item.country,
            'סקטור': item.industry || '',
            'שלב': item.stage,
            'ציון עניין': item.interest_num,
            'שווי מוערך': item.valuation,
            'קליקים/חודש': item.clicks,
            'מה החברה עושה': item.description,
            'למה להשקיע': item.why_invest
          }));
          const worksheet = XLSX.utils.json_to_sheet(excelData);
          XLSX.utils.book_append_sheet(workbook, worksheet, country.substring(0, 31));
        });
        XLSX.writeFile(workbook, 'LatAm_Research_Dark.xlsx');
      };

      const getStageStyle = (stageName) => {
        switch(stageName) {
          case 'לקראת הנפקה': return 'bg-purple-900/40 text-purple-400 border-purple-500/30';
          case 'טרנדיות': return 'bg-[#B2FF05]/20 text-[#B2FF05] border-[#B2FF05]/30';
          case 'חזקות': return 'bg-teal-900/40 text-teal-400 border-teal-500/30';
          case 'מומנטום': return 'bg-orange-900/40 text-orange-400 border-orange-500/30';
          default: return 'bg-gray-800 text-gray-300 border-gray-600';
        }
      };

      return (
        <div className="min-h-screen">
          
          <header className="px-8 py-6 border-b border-[#232D36] flex justify-between items-center bg-[#0a0f14]/80 backdrop-blur-md sticky top-0 z-10">
            <div>
              <h1 className="text-2xl font-bold text-white tracking-wide">טבלת המחקר <span className="text-gray-500 text-sm mr-4 font-normal">{filteredData.length} חברות • מודל חכם</span></h1>
            </div>
            <div className="flex gap-4">
              <button onClick={() => window.location.reload()} className="flex items-center gap-2 bg-[#131A22] border border-[#232D36] hover:border-gray-500 text-white px-4 py-2 rounded-full text-sm transition-all">
                <i className="fas fa-sync-alt"></i>
                רענון נתונים
              </button>
              <button onClick={exportToExcel} className="flex items-center gap-2 bg-[#131A22] border border-[#232D36] hover:border-[#B2FF05]/50 hover:text-[#B2FF05] text-white px-4 py-2 rounded-full text-sm transition-all">
                <i className="fas fa-download"></i>
                ייצוא כל הנתונים
              </button>
            </div>
          </header>

          <main className="max-w-[1400px] mx-auto px-4 py-8">
            
            <div className="flex flex-wrap gap-3 mb-6">
              {STAGES.map(s => (
                <button
                  key={s.id}
                  onClick={() => setSelectedStage(s.id)}
                  className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium border transition-all ${
                    selectedStage === s.id 
                    ? 'bg-[#1a232c] border-gray-500 text-white shadow-lg' 
                    : 'bg-[#131A22] border-[#232D36] text-gray-400 hover:bg-[#1a232c]'
                  }`}
                >
                  <div className={`w-2 h-2 rounded-full ${s.color}`}></div>
                  {s.label}
                  {s.id === 'הכל' && <span className="bg-[#232D36] text-gray-300 text-xs px-2 py-0.5 rounded-full ml-1">{data.length}</span>}
                </button>
              ))}
            </div>

            <div className="flex flex-wrap gap-2 mb-8 items-center bg-[#131A22] p-2 rounded-2xl border border-[#232D36]">
              <span className="text-sm text-gray-500 px-3 flex items-center gap-2">
                <i className="fas fa-globe"></i> מדינה:
              </span>
              {COUNTRIES.map(country => (
                <button
                  key={country}
                  onClick={() => setSelectedCountry(country)}
                  className={`px-4 py-1.5 rounded-full text-sm transition-all ${
                    selectedCountry === country
                      ? 'bg-[#0a0f14] border border-[#B2FF05] text-[#B2FF05]'
                      : 'bg-transparent text-gray-400 hover:text-white'
                  }`}
                >
                  {country}
                </button>
              ))}
            </div>

            <div className="bg-[#131A22] border border-[#232D36] rounded-2xl overflow-hidden shadow-2xl">
              <div className="overflow-x-auto">
                <table className="w-full text-right border-collapse whitespace-nowrap">
                  <thead>
                    <tr className="border-b border-[#232D36] text-gray-500 text-xs uppercase tracking-wider">
                      <th className="py-4 px-6 font-medium">חברה</th>
                      <th className="py-4 px-6 font-medium">מדינה</th>
                      <th className="py-4 px-6 font-medium">סקטור</th>
                      <th className="py-4 px-6 font-medium text-center">שלב</th>
                      <th className="py-4 px-6 font-medium">עניין ↓</th>
                      <th className="py-4 px-6 font-medium">קליקים/חודש</th>
                      <th className="py-4 px-6 font-medium">מודעות/חודש</th>
                      <th className="py-4 px-6 font-medium">הון שגויס</th>
                      <th className="py-4 px-6 font-medium">שווי מוערך</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#232D36]">
                    {loading ? (
                      <tr><td colSpan="9" className="py-16 text-center text-gray-500 flex justify-center"><i className="fas fa-spinner fa-spin text-2xl"></i></td></tr>
                    ) : filteredData.length === 0 ? (
                      <tr><td colSpan="9" className="py-16 text-center text-gray-500">לא נמצאו חברות העונות לסינון.</td></tr>
                    ) : (
                      filteredData.map((item) => (
                        <tr 
                          key={item.id}
                          onClick={() => setSelectedCompany(item)}
                          className="hover:bg-[#1a232c] cursor-pointer transition-colors group"
                        >
                          <td className="py-4 px-6">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 rounded-lg bg-gray-800 border border-gray-700 flex items-center justify-center font-bold text-gray-300">
                                {item.ticker}
                              </div>
                              <div>
                                <div className="font-bold text-white group-hover:text-[#B2FF05] transition-colors">{item.name}</div>
                                <div className="text-xs text-gray-500 mt-1 flex items-center gap-1">
                                  <span className="text-[#B2FF05]">↗ פרטית</span> • <span className="text-gray-400">אמין</span>
                                </div>
                              </div>
                            </div>
                          </td>
                          <td className="py-4 px-6 text-gray-400">{item.country}</td>
                          <td className="py-4 px-6 text-gray-400">{item.industry}</td>
                          <td className="py-4 px-6 text-center">
                            <span className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-medium border ${getStageStyle(item.stage)}`}>
                              {item.stage}
                            </span>
                          </td>
                          <td className="py-4 px-6">
                            <div className="flex items-center gap-3">
                              <span className="text-white font-medium w-6">{item.interest_num}</span>
                              <div className="w-16 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                                <div className="h-full bg-[#B2FF05]" style={{width: `${item.interest_num}%`}}></div>
                              </div>
                            </div>
                          </td>
                          <td className="py-4 px-6 font-medium text-gray-300">{item.clicks}</td>
                          <td className="py-4 px-6 font-medium text-gray-300">{item.ad_spend}</td>
                          <td className="py-4 px-6 font-medium text-gray-300">{item.raised}</td>
                          <td className="py-4 px-6 font-bold text-white">{item.valuation}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Modal */}
          {selectedCompany && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
              <div 
                className="absolute inset-0 bg-black/80 backdrop-blur-sm" 
                onClick={() => setSelectedCompany(null)}
              ></div>
              
              <div className="relative w-full max-w-4xl max-h-[90vh] overflow-y-auto bg-[#0a0f14] border border-[#232D36] rounded-2xl shadow-2xl flex flex-col custom-scrollbar">
                
                <div className="sticky top-0 bg-[#0a0f14]/90 backdrop-blur border-b border-[#232D36] p-6 z-10 flex justify-between items-start">
                  <div>
                    <div className="text-sm text-gray-500 mb-2">{selectedCompany.country} - {selectedCompany.industry}</div>
                    <div className="flex items-center gap-4">
                      <h2 className="text-3xl font-bold text-white">{selectedCompany.name}</h2>
                      <span className={`px-3 py-1 rounded-full text-xs font-medium border ${getStageStyle(selectedCompany.stage)}`}>
                        {selectedCompany.stage}
                      </span>
                    </div>
                    <div className="text-gray-400 mt-2">פרטית - שווי מוערך <span className="text-white font-bold">{selectedCompany.valuation}</span></div>
                  </div>
                  <button 
                    onClick={() => setSelectedCompany(null)}
                    className="p-2 text-gray-500 hover:text-white hover:bg-gray-800 rounded-full transition-colors"
                  >
                    <i className="fas fa-times text-xl"></i>
                  </button>
                </div>

                <div className="p-6 space-y-6">
                  
                  <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5">
                    <h3 className="text-sm font-bold text-gray-400 flex items-center gap-2 mb-2"><i className="fas fa-info-circle"></i> מה היא עושה</h3>
                    <p className="text-white text-base leading-relaxed">{selectedCompany.description}</p>
                  </div>

                  <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5">
                    <h3 className="text-sm font-bold text-[#B2FF05] flex items-center gap-2 mb-2"><i className="fas fa-chart-line"></i> למה שווה להשקיע</h3>
                    <p className="text-white text-base leading-relaxed">{selectedCompany.why_invest}</p>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5 flex flex-col justify-center text-center">
                      <div className="text-sm text-gray-500 mb-1">קליקים בחודש</div>
                      <div className="text-2xl font-bold text-white">{selectedCompany.clicks}</div>
                    </div>
                    <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5 flex flex-col justify-center text-center">
                      <div className="text-sm text-gray-500 mb-1">הוצאה על מודעות</div>
                      <div className="text-2xl font-bold text-white">{selectedCompany.ad_spend}</div>
                    </div>
                    <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5 flex flex-col justify-center text-center">
                      <div className="text-sm text-gray-500 mb-1">הון שגויס</div>
                      <div className="text-2xl font-bold text-white">{selectedCompany.raised}</div>
                    </div>
                    <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5 flex flex-col justify-center text-center">
                      <div className="text-sm text-gray-500 mb-1">צמיחה שנתית</div>
                      <div className="text-2xl font-bold text-[#B2FF05]">{selectedCompany.growth}</div>
                    </div>
                  </div>

                  <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5 flex flex-col items-center">
                    <div className="text-sm text-gray-500 mb-4">מדדים</div>
                    <div className="flex gap-8 w-full justify-center">
                      <div className="flex items-center gap-3">
                        <span className="text-sm text-gray-300">עניין</span>
                        <span className="text-white font-bold">{selectedCompany.interest_num}</span>
                        <div className="w-24 h-1.5 bg-gray-800 rounded-full"><div className="h-full bg-orange-400 rounded-full" style={{width: `${selectedCompany.interest_num}%`}}></div></div>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-sm text-gray-300">חשיפה</span>
                        <span className="text-white font-bold">{selectedCompany.exposure}</span>
                        <div className="w-24 h-1.5 bg-gray-800 rounded-full"><div className="h-full bg-teal-400 rounded-full" style={{width: `${selectedCompany.exposure}%`}}></div></div>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-sm text-gray-300">מודעות</span>
                        <span className="text-white font-bold">{selectedCompany.ad_metric}</span>
                        <div className="w-24 h-1.5 bg-gray-800 rounded-full"><div className="h-full bg-purple-400 rounded-full" style={{width: `${selectedCompany.ad_metric}%`}}></div></div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5">
                    <h3 className="text-sm font-bold text-gray-400 flex items-center gap-2 mb-3"><i className="fas fa-wave-square"></i> המניע</h3>
                    <div className="space-y-3">
                      <p className="text-sm"><strong className="text-white">מה מרגיש:</strong> <span className="text-gray-400">{selectedCompany.feeling}</span></p>
                      <p className="text-sm"><strong className="text-white">מה מכניס כסף:</strong> <span className="text-gray-400">{selectedCompany.money}</span></p>
                    </div>
                  </div>

                  <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-5 text-center">
                    <h3 className="text-sm font-bold text-gray-500 mb-2">זווית מודעת השקעה</h3>
                    <p className="text-lg text-white font-medium">"{selectedCompany.ad_angle}"</p>
                  </div>

                </div>

                <div className="sticky bottom-0 bg-[#0a0f14]/90 backdrop-blur border-t border-[#232D36] p-4 z-10 flex justify-center gap-4">
                  <button className="flex items-center gap-2 bg-transparent border border-[#B2FF05] text-[#B2FF05] hover:bg-[#B2FF05]/10 px-6 py-2.5 rounded-full font-medium transition-colors">
                    פתח בגוגל טרנדס <i className="fas fa-external-link-alt"></i>
                  </button>
                  <button className="flex items-center gap-2 bg-[#232D36] text-white hover:bg-gray-700 px-6 py-2.5 rounded-full font-medium transition-colors">
                    מודעות פעילות <i className="fas fa-external-link-alt"></i>
                  </button>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
