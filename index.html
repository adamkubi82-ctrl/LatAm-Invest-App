<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LatAm Invest Terminal | מחקר השקעות אמריקה הלטינית</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Heebo', sans-serif;
      background-color: #0B0F14;
      color: #E2E8F0;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0B0F14; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const supabaseUrl = 'https://oikogvyjchqjwxfembcd.supabase.co';
    const supabaseKey = 'sb_publishable_wfndEaEpiSiJ0ogGOmqF8g_XGvOx1h4';

    const isSharedView = new URLSearchParams(window.location.search).get('view') === 'share';

    const IconInfo = () => (
      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    const IconShare = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
      </svg>
    );
    const IconSearch = () => (
      <svg className="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );
    const IconActivity = () => (
      <svg className="w-4 h-4 text-[#B2FF05]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    );
    const IconExternal = () => (
      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    );
    const IconClose = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const COUNTRIES = [
      { id: 'הכל', label: 'כל המדינות' },
      { id: 'ברזיל', label: 'ברזיל' },
      { id: 'מקסיקו', label: 'מקסיקו' },
      { id: 'קולומביה', label: 'קולומביה' },
      { id: "צ'ילה", label: "צ'ילה" },
      { id: 'ארגנטינה', label: 'ארגנטינה' },
      { id: 'פרו', label: 'פרו' },
      { id: 'אורוגוואי', label: 'אורוגוואי' },
      { id: 'אקוודור', label: 'אקוודור' },
      { id: 'קוסטה ריקה', label: 'קוסטה ריקה' }
    ];

    const STAGES = [
      { id: 'הכל', label: 'הכל', color: 'bg-gray-400' },
      { id: 'לקראת הנפקה', label: 'לקראת הנפקה', color: 'bg-purple-500' },
      { id: 'טרנדיות', label: 'טרנדיות', color: 'bg-lime-400' },
      { id: 'מומנטום', label: 'מומנטום', color: 'bg-orange-500' },
      { id: 'חזקות', label: 'חזקות', color: 'bg-teal-500' }
    ];

    const Tooltip = ({ text, children, position = 'bottom' }) => {
      const positionClasses = position === 'top' 
        ? "bottom-full left-1/2 -translate-x-1/2 mb-2.5" 
        : "top-full left-1/2 -translate-x-1/2 mt-2.5";
        
      const arrowClasses = position === 'top'
        ? "top-full left-1/2 -translate-x-1/2 -mt-1.5 border-b border-r transform rotate-45"
        : "bottom-full left-1/2 -translate-x-1/2 -mb-1.5 border-t border-l transform rotate-45";

      return (
        <div className="relative group inline-flex items-center gap-1.5 cursor-help">
          {children}
          <span className="text-gray-500 group-hover:text-[#B2FF05] transition-colors">
            <IconInfo />
          </span>
          <div className={`absolute ${positionClasses} hidden group-hover:block w-64 p-3 bg-[#1A232E] text-gray-200 text-xs rounded-xl shadow-2xl z-[100] border border-[#2D3A4B] font-normal normal-case text-right whitespace-normal leading-relaxed pointer-events-none`}>
            {text}
            <div className={`absolute ${arrowClasses} w-2.5 h-2.5 bg-[#1A232E] border-[#2D3A4B]`}></div>
          </div>
        </div>
      );
    };

    const getStageBadge = (stage) => {
      switch (stage) {
        case 'לקראת הנפקה': return 'bg-purple-500/15 text-purple-300 border-purple-500/30';
        case 'טרנדיות': return 'bg-lime-400/15 text-[#B2FF05] border-lime-400/30';
        case 'מומנטום': return 'bg-orange-500/15 text-orange-300 border-orange-500/30';
        case 'חזקות': return 'bg-teal-500/15 text-teal-300 border-teal-500/30';
        default: return 'bg-gray-500/15 text-gray-300 border-gray-500/30';
      }
    };

    const getInitials = (name) => {
      if (!name) return 'CO';
      return name.replace(/[^a-zA-Z0-9]/g, '').substring(0, 2).toUpperCase() || 'CO';
    };

    const parseInterestScore = (level) => {
      if (!level) return 65;
      if (!isNaN(Number(level))) return Number(level);
      if (level.includes('גבוה מאוד')) return 92;
      if (level.includes('גבוה')) return 82;
      if (level.includes('עלייה')) return 78;
      if (level.includes('בינוני')) return 65;
      return 55;
    };

    const deriveStage = (item) => {
      const level = item.interest_level || '';
      if (level.includes('גבוה מאוד')) return 'לקראת הנפקה';
      if (level.includes('גבוה')) return 'טרנדיות';
      if (level.includes('עלייה')) return 'מומנטום';
      return 'חזקות';
    };

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [selectedCountry, setSelectedCountry] = useState('הכל');
      const [selectedStage, setSelectedStage] = useState('הכל');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCompany, setSelectedCompany] = useState(null);
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        async function fetchData() {
          setLoading(true);
          try {
            const response = await fetch(`${supabaseUrl}/rest/v1/latam_companies?select=*&order=id.desc`, {
              headers: {
                'apikey': supabaseKey,
                'Authorization': `Bearer ${supabaseKey}`
              }
            });
            
            const dbData = response.ok ? await response.json() : [];
            const fetched = Array.isArray(dbData) ? dbData : [];
            
            if (fetched.length > 0) {
              const newest = fetched.reduce((acc, curr) => {
                const dateVal = curr.updated_at || curr.created_at;
                if (!dateVal) return acc;
                return new Date(dateVal) > new Date(acc) ? dateVal : acc;
              }, fetched[0].updated_at || fetched[0].created_at || new Date().toISOString());
              
              setLastUpdated(new Date(newest).toLocaleDateString('he-IL', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
              }));
            }

            const enrichedDB = fetched.map(item => {
              const score = parseInterestScore(item.interest_level);
              const computedStage = deriveStage(item);
              return {
                ...item,
                sector: item.industry || 'פינטק וטכנולוגיה',
                stage: computedStage,
                interest_num: score,
                driver_type: item.motivation || 'כסף ותשואה (קר)',
                driver_desc: item.motivation?.includes('רגשי')
                  ? 'שיח ער ברשתות החברתיות ואימוץ מהיר בקרב קהל צעיר המונע מחדשנות ומותג.' 
                  : item.motivation?.includes('חדשנות')
                  ? 'יתרון טכנולוגי מובהק ופתרון דיגיטלי מתקדם בשוק המקומי.'
                  : 'העדפת משתמשים המבוססת על חיסכון בעמלות, יציבות פיננסית ותשואה כלכלית.'
              };
            }).sort((a, b) => b.interest_num - a.interest_num);

            setData(enrichedDB);
          } catch (err) {
            console.error("Fetch error:", err);
          } finally {
            setLoading(false);
          }
        }
        fetchData();
      }, []);

      const filteredData = useMemo(() => {
        return data.filter(item => {
          const matchCountry = selectedCountry === 'הכל' || item.country === selectedCountry;
          const matchStage = selectedStage === 'הכל' || item.stage === selectedStage;
          const matchSearch = !searchQuery || 
            item.name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.sector?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.country?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.catalyst?.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCountry && matchStage && matchSearch;
        });
      }, [data, selectedCountry, selectedStage, searchQuery]);

      const handleCopyShareLink = () => {
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?view=share`;
        navigator.clipboard.writeText(shareUrl);
        setCopied(true);
        setTimeout(() => setCopied(false), 3000);
      };

      const stageTooltips = {
        'טרנדיות': 'חברות שמייצרות המון רעש וחיפושים ברשת כרגע (Hype), לרוב בעקבות קמפיין חזק או כניסה לסקטור חם.',
        'מומנטום': 'חברות שנמצאות במסלול צמיחה עקבי ומוכח בהכנסות ובגיוסי הון (תנופה עסקית אמיתית).',
        'לקראת הנפקה': 'חברות בשלות הנמצאות בשלבי גיוס מתקדמים (Pre-IPO) ונערכות להנפקה בבורסה.',
        'חזקות': 'חברות עוגן מבוססות ורווחיות עם נתח שוק משמעותי ויציבות פיננסית.'
      };

      return (
        <div className="min-h-screen bg-[#0B0F14] text-gray-200 pb-16">
          <header className="border-b border-[#1E2732] bg-[#0E131A]/90 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <div className="w-3 h-3 rounded-full bg-[#B2FF05] shadow-[0_0_12px_#B2FF05]"></div>
                  <h1 className="text-xl font-black tracking-tight text-white">
                    LATAM <span className="text-[#B2FF05]">INVEST</span> TERMINAL
                  </h1>
                  <span className="text-[11px] bg-[#1A232E] text-gray-400 border border-[#2D3A4B] px-2.5 py-0.5 rounded-full">
                    דוח מחקר מאומת • תצוגה בלבד
                  </span>
                </div>
                <p className="text-xs text-gray-400 mt-1">
                  סקירת שוק ומודיעין עסקי לשווקים מתעוררים באמריקה הלטינית {lastUpdated ? `• מהדורת ${lastUpdated}` : ''}
                </p>
              </div>

              {!isSharedView && (
                <div className="flex items-center gap-3">
                  <button 
                    onClick={handleCopyShareLink}
                    className="bg-[#B2FF05] hover:bg-[#a1e604] text-[#0B0F14] px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition-all shadow-[0_0_15px_rgba(178,255,5,0.2)]"
                  >
                    <IconShare />
                    {copied ? 'הקישור הועתק! (מוכן לשליחה)' : 'העתק קישור לתצוגה בלבד'}
                  </button>
                </div>
              )}
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 space-y-6">
            <div className="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar">
              {COUNTRIES.map(country => {
                const count = country.id === 'הכל' 
                  ? data.length 
                  : data.filter(d => d.country === country.id).length;
                
                return (
                  <button
                    key={country.id}
                    onClick={() => setSelectedCountry(country.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center gap-2 border ${
                      selectedCountry === country.id
                        ? 'bg-[#B2FF05] text-[#0B0F14] border-[#B2FF05] font-bold shadow-[0_0_15px_rgba(178,255,5,0.2)]'
                        : 'bg-[#131A22] text-gray-400 border-[#232D36] hover:border-gray-600 hover:text-gray-200'
                    }`}
                  >
                    <span>{country.label}</span>
                    <span className={`px-1.5 py-0.5 rounded-md text-[10px] ${
                      selectedCountry === country.id ? 'bg-black/20 text-black' : 'bg-[#1C2530] text-gray-400'
                    }`}>
                      {count}
                    </span>
                  </button>
                );
              })}
            </div>

            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#11171F] p-4 rounded-2xl border border-[#1E2732]">
              <div className="flex flex-wrap items-center gap-2">
                {STAGES.map(stage => {
                  const btn = (
                    <button
                      key={stage.id}
                      onClick={() => setSelectedStage(stage.id)}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2 border ${
                        selectedStage === stage.id
                          ? 'bg-[#1A232E] text-white border-[#B2FF05]/50 shadow-[0_0_10px_rgba(178,255,5,0.1)]'
                          : 'bg-[#131A22] text-gray-400 border-[#232D36] hover:border-gray-600'
                      }`}
                    >
                      <span className={`w-2 h-2 rounded-full ${stage.color}`}></span>
                      {stage.label}
                    </button>
                  );

                  return stageTooltips[stage.id] ? (
                    <Tooltip key={stage.id} text={stageTooltips[stage.id]} position="bottom">
                      {btn}
                    </Tooltip>
                  ) : btn;
                })}
              </div>

              <div className="relative w-full md:w-72">
                <div className="absolute inset-y-0 right-3 flex items-center pointer-events-none">
                  <IconSearch />
                </div>
                <input
                  type="text"
                  placeholder="חיפוש חברה, סקטור או מדינה..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-[#0B0F14] border border-[#232D36] focus:border-[#B2FF05] rounded-xl py-2 pr-10 pl-4 text-xs text-white placeholder-gray-500 focus:outline-none transition-colors"
                />
              </div>
            </div>

            <div className="bg-[#11171F] border border-[#1E2732] rounded-2xl overflow-visible shadow-xl">
              <div className="overflow-x-auto overflow-y-visible">
                <table className="w-full text-right border-collapse">
                  <thead>
                    <tr className="border-b border-[#1E2732] text-gray-400 text-xs bg-[#141B24]">
                      <th className="py-4 px-5 font-medium">חברה</th>
                      <th className="py-4 px-4 font-medium">מדינה</th>
                      <th className="py-4 px-4 font-medium">סקטור</th>
                      <th className="py-4 px-4 font-medium text-center">
                        <Tooltip text="סיווג החברה: טרנדיות (רעש וחיפושים ברשת) מול מומנטום (צמיחה עסקית וגיוסים מוכחים), לקראת הנפקה או חברות עוגן חזקות." position="bottom">
                          שלב
                        </Tooltip>
                      </th>
                      <th className="py-4 px-4 font-medium">עניין ↓</th>
                      <th className="py-4 px-4 font-medium">המניע המרכזי</th>
                      <th className="py-4 px-4 font-medium">למה בכותרות עכשיו</th>
                      <th className="py-4 px-4 font-medium">הון שגויס</th>
                      <th className="py-4 px-5 font-medium">שווי מוערך</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#1E2732]/60 text-sm">
                    {loading ? (
                      <tr>
                        <td colSpan="9" className="py-16 text-center text-gray-500">
                          טוען נתוני מחקר...
                        </td>
                      </tr>
                    ) : filteredData.length === 0 ? (
                      <tr>
                        <td colSpan="9" className="py-16 text-center text-gray-500">
                          לא נמצאו חברות התואמות לסינון הנוכחי.
                        </td>
                      </tr>
                    ) : (
                      filteredData.map((company, idx) => (
                        <tr 
                          key={company.id || idx}
                          onClick={() => setSelectedCompany(company)}
                          className="hover:bg-[#17202B] transition-colors cursor-pointer group"
                        >
                          <td className="py-4 px-5">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 rounded-xl bg-[#1A232E] border border-[#2A3644] flex items-center justify-center font-bold text-xs text-gray-300 group-hover:border-[#B2FF05]/50 group-hover:text-[#B2FF05] transition-colors shrink-0">
                                {getInitials(company.name)}
                              </div>
                              <div>
                                <div className="font-bold text-white group-hover:text-[#B2FF05] transition-colors">
                                  {company.name}
                                </div>
                                <div className="text-[11px] text-gray-500 flex items-center gap-1.5 mt-0.5">
                                  <span className="text-emerald-400">↗</span>
                                  <span>{company.status || 'פרטית'}</span>
                                </div>
                              </div>
                            </div>
                          </td>
                          <td className="py-4 px-4 text-gray-300 text-xs whitespace-nowrap">{company.country}</td>
                          <td className="py-4 px-4 text-gray-400 text-xs">{company.sector}</td>
                          <td className="py-4 px-4 text-center whitespace-nowrap">
                            <span className={`px-3 py-1 rounded-full text-xs font-medium border ${getStageBadge(company.stage)}`}>
                              {company.stage}
                            </span>
                          </td>
                          <td className="py-4 px-4">
                            <div className="flex items-center gap-2.5">
                              <span className="font-bold text-white w-6">{company.interest_num}</span>
                              <div className="w-14 h-1.5 bg-[#1E2732] rounded-full overflow-hidden">
                                <div 
                                  className="h-full bg-[#B2FF05] rounded-full" 
                                  style={{ width: `${Math.min(100, company.interest_num)}%` }}
                                ></div>
                              </div>
                            </div>
                          </td>
                          <td className="py-4 px-4 text-gray-300 text-xs">{company.driver_type}</td>
                          <td className="py-4 px-4 text-gray-400 text-xs max-w-[220px] truncate" title={company.catalyst}>
                            {company.catalyst || 'פעילות צומחת בשוק המקומי'}
                          </td>
                          <td className="py-4 px-4 text-gray-300 font-mono text-xs whitespace-nowrap">{company.raised || 'לא פורסם'}</td>
                          <td className="py-4 px-5 font-bold text-white font-mono text-xs whitespace-nowrap">{company.valuation || 'לא פורסם'}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {selectedCompany && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
              onClick={() => setSelectedCompany(null)}
            >
              <div 
                className="bg-[#0F151D] border border-[#232D36] rounded-2xl max-w-2xl w-full p-6 space-y-5 shadow-2xl relative"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-start justify-between border-b border-[#1E2732] pb-4">
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-xl bg-[#1A232E] border border-[#B2FF05]/40 flex items-center justify-center font-black text-base text-[#B2FF05]">
                      {getInitials(selectedCompany.name)}
                    </div>
                    <div>
                      <div className="flex items-center gap-3">
                        <h2 className="text-xl font-black text-white">{selectedCompany.name}</h2>
                        <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium border ${getStageBadge(selectedCompany.stage)}`}>
                          {selectedCompany.stage}
                        </span>
                      </div>
                      <p className="text-xs text-gray-400 mt-1">
                        {selectedCompany.country} • {selectedCompany.sector} • {selectedCompany.status || 'פרטית'}
                      </p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setSelectedCompany(null)}
                    className="text-gray-400 hover:text-white p-1.5 rounded-lg bg-[#161E27] transition-colors"
                  >
                    <IconClose />
                  </button>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  <div className="bg-[#131A22] border border-[#232D36] p-3.5 rounded-xl">
                    <div className="text-xs text-gray-500">שווי מוערך מאומת</div>
                    <div className="text-base font-bold text-white mt-1 font-mono">{selectedCompany.valuation || 'לא פורסם'}</div>
                  </div>
                  <div className="bg-[#131A22] border border-[#232D36] p-3.5 rounded-xl">
                    <div className="text-xs text-gray-500">הון שגויס מאומת</div>
                    <div className="text-base font-bold text-white mt-1 font-mono">{selectedCompany.raised || 'לא פורסם'}</div>
                  </div>
                  <div className="bg-[#131A22] border border-[#232D36] p-3.5 rounded-xl">
                    <div className="text-xs text-gray-500">רמת עניין</div>
                    <div className="text-base font-bold text-emerald-400 mt-1">{selectedCompany.interest_level || selectedCompany.interest_num}</div>
                  </div>
                </div>

                <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-4 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-gray-300">קטליזטור וסיקור חדשותי אחרון</span>
                    {selectedCompany.source_url && (
                      <a 
                        href={selectedCompany.source_url} 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="text-xs text-[#B2FF05] hover:underline flex items-center gap-1 font-medium"
                      >
                        <span>לכתבת המקור</span>
                        <IconExternal />
                      </a>
                    )}
                  </div>
                  <p className="text-xs text-gray-300 leading-relaxed">
                    {selectedCompany.catalyst || 'פעילות צומחת בשוק המקומי.'}
                  </p>
                </div>

                <div className="bg-[#131A22] border border-[#232D36] rounded-xl p-4">
                  <h3 className="text-xs font-bold text-gray-300 flex items-center gap-2 mb-1.5">
                    <IconActivity />
                    המניע המרכזי (רגש מול כסף)
                  </h3>
                  <div className="text-xs text-[#B2FF05] font-medium mb-1">{selectedCompany.driver_type}</div>
                  <p className="text-xs text-gray-400 leading-relaxed">
                    {selectedCompany.driver_desc}
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
