    const COUNTRIES = [

    const Tooltip = ({ text, children, position = 'bottom' }) => {
      const positionClasses = position === 'top' 
        ? "bottom-full left-1/2 -translate-x-1/2 mb-2.5" 
        : "top-full left-1/2 -translate-x-1/2 mt-2.5";
        
      const arrowClasses = position === 'top'
        ? "top-full left-1/2 -translate-x-1/2 -mt-1.5 border-b border-r transform rotate-45"

    const getStageBadge = (stage) => {
      switch (stage) {
        case 'לקראת הנפקה': return 'bg-purple-500/15 text-purple-300 border-purple-500/30';
        case 'אחרי הנפקה': return 'bg-blue-500/15 text-blue-300 border-blue-500/30';
        case 'טרנדיות': return 'bg-lime-400/15 text-[#B2FF05] border-lime-400/30';
        case 'מומנטום': return 'bg-orange-500/15 text-orange-300 border-orange-500/30';
        case 'חזקות': return 'bg-teal-500/15 text-teal-300 border-teal-500/30';
        default: return 'bg-gray-500/15 text-gray-300 border-gray-500/30';
      }
    };

    const getInitials = (name) => {
      if (!name) return 'CO';
      return name.replace(/[^a-zA-Z0-9]/g, '').substring(0, 2).toUpperCase() || 'CO';
    };

    const parseMediaScore = (level) => {
      if (!level) return 65;
      const numeric = Number(String(level).replace(/[^0-9.]/g, ''));
      if (!isNaN(numeric) && numeric > 0) return Math.min(100, Math.round(numeric));
      if (String(level).includes('גבוה מאוד')) return 91;
      if (String(level).includes('גבוה')) return 82;
      if (String(level).includes('עלייה')) return 76;
      if (String(level).includes('בינוני')) return 64;
      return 55;
    };

    const deriveStage = (item) => {
      const status = (item.status || '').toLowerCase();
      const score = parseMediaScore(item.interest_level);
      
      if (status.includes('אחרי הנפקה')) return 'אחרי הנפקה';
      if (status.includes('לקראת הנפקה')) return 'לקראת הנפקה';
      if (status.includes('nyse') || status.includes('nasdaq') || status.includes('בורסאית') || status.includes('bmv') || status.includes('bcs') || status.includes(':')) {
        return 'חזקות';
      }
      if (score >= 82) return 'טרנדיות';
      if (score >= 72) return 'מומנטום';
      return 'חזקות';
    };

    const isNonTraded = (company) => {
      const status = (company.status || '').toLowerCase();
      if (
        status.includes('לקראת הנפקה') ||
        status.includes('אחרי הנפקה') ||
        status.includes('nyse') ||
        status.includes('nasdaq') ||
        status.includes('בורסאית') ||
        status.includes('bmv') ||
        status.includes('bcs') ||
        status.includes(':')
      ) {
        return false;
      }
      return true;
    };

    const enrichStabilityAndAudience = (item, computedStage, isPublic) => {
      const sector = (item.industry || item.sector || '').toLowerCase();

      let stability = Number(item.stability_score);
      if (!stability || isNaN(stability)) {
        stability = 58;
        if (isPublic) stability += 22;
        if (computedStage === 'חזקות') stability += 12;
        if (computedStage === 'אחרי הנפקה') stability += 6;
        if (sector.includes('בנק') || sector.includes('אנרגיה') || sector.includes('תקשורת') || sector.includes('קמעונאות') || sector.includes('תעופה') || sector.includes('תעשייה')) {
          stability += 8;
        }
        if (sector.includes('קריפטו') || sector.includes('בינה')) {
          stability -= 12;
        }
        stability = Math.max(35, Math.min(97, stability));
      }

      const audienceAge = item.audience_age || (
        stability >= 78
          ? '45–65+ (בוגרים ומשפחות)'
          : stability >= 64
          ? '30–55 (קהל רחב)'
          : '25–42 (צעירים ודיגיטליים)'
      );

      const techLiteracy = item.tech_literacy || (
        sector.includes('קריפטו') || sector.includes('תוכנה') || sector.includes('סייבר') || sector.includes('בינה')
          ? 'גבוהה (מוצר טכנולוגי מתקדם)'
          : sector.includes('פינטק')
          ? 'בינונית (שימוש בסיסי באפליקציה)'
          : 'נמוכה (מותג יומיומי מוכר)'
      );

      const riskProfile = item.risk_profile || (
        stability >= 78
          ? 'שמרני (חוששים ממסחר מורכב)'
          : stability >= 64
          ? 'מאוזן (מחפשים יציבות עם צמיחה)'
          : 'מחפשי צמיחה וסיכון'
      );

      return {
        stability_num: stability,
        audience_age: audienceAge,
        tech_literacy: techLiteracy,
        risk_profile: riskProfile
      };
    };

    const buildChatGptMoodBoardUrl = (company) => {
      const promptText = `Create a single 16:9 image that is a 2x2 grid Mood Board collage (4 equal square panels) of direct-response NATIVE / PERFORMANCE INVESTMENT ADS focused on INVESTING IN THE STOCK / GROWTH OF "${company.name}" (${company.country}).

CRITICAL PERSPECTIVE RULE (READ CAREFULLY):
- DO NOT write an ad from "${company.name}" asking users to download "${company.name}"'s app or buy "${company.name}"'s product (NEVER write "Descargá la app de ${company.name}").
- Instead, these are THIRD-PARTY INVESTMENT OPPORTUNITY ADS showing regular people in ${company.country} how to MAKE EXTRA INCOME by investing in "${company.name}" itself (shares/CFDs/growth).
- ALL text inside the image MUST be in natural local SPANISH for ${company.country}. ZERO Hebrew inside the image. Use the official "${company.name}" logo/brand look accurately.

EXACT HEADLINE ANGLES FOR THE 4 PANELS (adapt naturally to ${company.country} Spanish, max 7-9 words per panel):
- Top-Right Panel (Simple Extra Income Angle): "¿Ingresos extra sin complicarte? Ganá con ${company.name}" + profit growth chart & "${company.name}" logo.
- Top-Left Panel (Customer-to-Investor Angle): "Ya usás ${company.name}. Ahora ganá dinero con ellos" + local person in ${company.country} smiling at phone returns.
- Bottom-Right Panel (Profit Calculator / Proof Angle): "Probamos cuánto podrías ganar con ${company.name}" + sleek potential earnings calculator UI.
- Bottom-Left Panel (Beginners / Over 50s Angle): "¿Sin experiencia o +50? Invertí fácil en ${company.name}" + friendly local older adult with coffee & smartphone.

OUTPUT INSTRUCTIONS:
1. Generate the 2x2 Mood Board image immediately.
2. Right below the image, list the exact Spanish text from each of the 4 panels and its Hebrew translation.`;

      return `https://chatgpt.com/?q=${encodeURIComponent(promptText)}`;
    };

    function DisruptiveStudio({ company, onClose }) {
      const [ads, setAds] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [customTwist, setCustomTwist] = useState('');
      const [generatingCustom, setGeneratingCustom] = useState(false);
      const [copiedIdx, setCopiedIdx] = useState(null);

      const [refineInputs, setRefineInputs] = useState({});
      const [refiningId, setRefiningId] = useState(null);

      const generateScenes = async (twist = '') => {
        if (twist) {
          setGeneratingCustom(true);
        } else {
          setLoading(true);
        }
        setError('');

        try {
          const res = await fetch(`${supabaseUrl}/functions/v1/generate-disruptive-ads`, {
            method: 'POST',
            headers: {
              'apikey': supabaseKey,
              'Authorization': `Bearer ${supabaseKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              company,
              customTwist: twist || undefined
            })
          });

          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || 'שגיאה ביצירת מודעות הטאבולה');
          }

          const stampedAds = (result.ads || []).map((item, i) => ({
            ...item,
            uid: `${Date.now()}_${i}_${Math.random().toString(36).slice(2, 6)}`,
            history: []
          }));

          if (twist && stampedAds.length > 0) {
            setAds(prev => [stampedAds[0], ...prev]);
            setCustomTwist('');
          } else {
            setAds(stampedAds);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
          setGeneratingCustom(false);
        }
      };

      useEffect(() => {
        generateScenes();
      }, [company.name]);

      const handleDeleteCard = (uid) => {
        setAds(prev => prev.filter(item => item.uid !== uid));
      };

      const handleRefineCard = async (ad) => {
        const feedback = (refineInputs[ad.uid] || '').trim();
        if (!feedback) return;

        setRefiningId(ad.uid);
        try {
          const res = await fetch(`${supabaseUrl}/functions/v1/generate-disruptive-ads`, {
            method: 'POST',
            headers: {
              'apikey': supabaseKey,
              'Authorization': `Bearer ${supabaseKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              company,
              refineFeedback: feedback,
              currentAd: {
                image: ad.image,
                headline_es: ad.headline_es,
                headline_he: ad.headline_he
              }
            })
          });

          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || 'שגיאה בתיקון הכרטיס');
          }

          if (result.ad) {
            setAds(prev => prev.map(item => {
              if (item.uid !== ad.uid) return item;
              const prevSnapshot = {
                image: item.image,
                headline_es: item.headline_es,
                headline_he: item.headline_he
              };
              return {
                ...result.ad,
                uid: item.uid,
                history: [...(item.history || []), prevSnapshot]
              };
            }));
            setRefineInputs(prev => ({ ...prev, [ad.uid]: '' }));
          }
        } catch (err) {
          alert(`שגיאה בתיקון: ${err.message}`);
        } finally {
          setRefiningId(null);
        }
      };

      const handleUndoCard = (uid) => {
        setAds(prev => prev.map(item => {
          if (item.uid !== uid || !item.history || item.history.length === 0) return item;
          const previousVersion = item.history[item.history.length - 1];
          const remainingHistory = item.history.slice(0, -1);
          return {
            ...item,
            image: previousVersion.image,
            headline_es: previousVersion.headline_es,
            headline_he: previousVersion.headline_he,
            history: remainingHistory
          };
        }));
      };

      const handleDownload = (dataUrl, index) => {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `${company.name.replace(/\s+/g, '_')}_taboola_invest_${index + 1}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleHeadlineChange = (uid, newText) => {
        setAds(prev => prev.map(item => item.uid === uid ? { ...item, headline_es: newText } : item));
      };

      const handleCopyHeadline = (text, uid) => {
        navigator.clipboard.writeText(text);
        setCopiedIdx(uid);
        setTimeout(() => setCopiedIdx(null), 2000);
      };

      return (
        <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col p-4 sm:p-6 overflow-y-auto">
          <div className="max-w-6xl w-full mx-auto flex-1 flex flex-col space-y-6 my-auto">
            <div className="flex items-center justify-between border-b border-[#1E2732] pb-4">
              <button 
                onClick={onClose}
                className="text-gray-400 hover:text-white p-2 rounded-xl bg-[#161E27] transition-colors"
              >
                <IconClose />
              </button>

              <div className="text-left">
                <div className="text-xs text-[#B2FF05] font-black uppercase tracking-wider mb-0.5">TABOOLA INVESTMENT AD STUDIO</div>
                <h2 className="text-lg font-black text-white">יחידות פרסום להשקעה ב-{company.name} ({company.country})</h2>
                <p className="text-xs text-gray-400">תמונת הפרעה לא-מלוקקת + כותרת השקעה מתחת לתמונה • ניתן לתקן, לחזור אחורה או למחוק כל כרטיס</p>
              </div>
            </div>

            <div className="bg-[#11171F] border border-[#232D36] p-4 rounded-2xl flex flex-col sm:flex-row gap-3 items-center">
              <input
                type="text"
                value={customTwist}
                onChange={e => setCustomTwist(e.target.value)}
                placeholder={`הוסף פוסט חדש עם רעיון משלך (למשל: "פנסיונר מקומי בודק רווחים בטלפון ליד חולצת ${company.name} וחתול שמושך שטר")...`}
                className="flex-1 w-full bg-[#0B0F14] border border-[#2D3A4B] focus:border-[#B2FF05] rounded-xl px-4 py-2.5 text-xs text-white outline-none"
              />
              <button
                onClick={() => generateScenes(customTwist)}
                disabled={!customTwist.trim() || generatingCustom || loading}
                className="w-full sm:w-auto bg-[#B2FF05] hover:bg-[#a1e604] disabled:opacity-40 text-[#0B0F14] px-5 py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-2 whitespace-nowrap transition-all"
              >
                <IconSparkles />
                <span>{generatingCustom ? 'מייצר פוסט חדש...' : 'הוסף פוסט מותאם'}</span>
              </button>
            </div>

            {loading ? (
              <div className="py-20 text-center space-y-4 bg-[#11171F] border border-[#1E2732] rounded-2xl">
                <div className="w-10 h-10 border-4 border-[#B2FF05] border-t-transparent rounded-full animate-spin mx-auto"></div>
                <div className="text-sm font-bold text-white">מייצר 3 יחידות Taboola ממוקדות-השקעה עבור {company.name}...</div>
                <p className="text-xs text-gray-400">צילומי סמארטפון אותנטיים ללא פילטרים + כותרות השקעה בספרדית מקומית (עד 99 תווים)</p>
              </div>
            ) : error ? (
              <div className="p-6 bg-red-500/10 border border-red-500/30 rounded-2xl text-center space-y-3">
                <div className="text-sm font-bold text-red-300 break-words">{error}</div>
                <button
                  onClick={() => generateScenes()}
                  className="bg-[#161E27] hover:bg-[#1E2732] text-white px-4 py-2 rounded-xl text-xs font-bold"
                >
                  נסה שוב
                </button>
              </div>
            ) : ads.length === 0 ? (
              <div className="py-16 text-center space-y-3 bg-[#11171F] border border-[#1E2732] rounded-2xl">
                <div className="text-sm text-gray-400">הסרת את כל האופציות מהמסך.</div>
                <button
                  onClick={() => generateScenes()}
                  className="bg-[#B2FF05] text-[#0B0F14] px-4 py-2 rounded-xl text-xs font-black"
                >
                  ייצר סט חדש של 3 פוסטים
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {ads.map((ad, idx) => {
                  const charCount = (ad.headline_es || '').length;
                  const isOverLimit = charCount > 99;
                  const isRefiningThis = refiningId === ad.uid;
                  const historyCount = (ad.history || []).length;

                  return (
                    <div key={ad.uid} className="bg-[#11171F] border border-[#1E2732] rounded-2xl overflow-hidden flex flex-col shadow-xl relative">
                      {isRefiningThis && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-xs z-20 flex flex-col items-center justify-center p-4 text-center space-y-2">
                          <div className="w-8 h-8 border-3 border-[#B2FF05] border-t-transparent rounded-full animate-spin"></div>
                          <div className="text-xs font-bold text-[#B2FF05]">מדייק את הפוסט לפי הבקשה שלך...</div>
                        </div>
                      )}

                      <div className="relative aspect-video bg-black">
                        <img src={ad.image} alt={`Taboola Ad ${idx + 1}`} className="w-full h-full object-cover" />
                        <span className="absolute top-2.5 right-2.5 bg-black/75 backdrop-blur-sm text-white text-[10px] font-bold px-2.5 py-1 rounded-md border border-white/10">
                          TABOOLA #{idx + 1}
                        </span>
                        <button
                          onClick={() => handleDeleteCard(ad.uid)}
                          title="זרוק אופציה זו"
                          className="absolute top-2.5 left-2.5 bg-red-950/85 hover:bg-red-600 text-red-200 hover:text-white px-2.5 py-1 rounded-md text-[10px] font-bold flex items-center gap-1 border border-red-500/40 transition-colors"
                        >
                          <IconTrash />
                          <span>זרוק</span>
                        </button>
                      </div>

                      <div className="p-4 flex-1 flex flex-col justify-between space-y-3 bg-[#141B24]">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between text-[11px]">
                            <span className="text-gray-400 font-medium">כותרת מתחת לתמונה:</span>
                            <span className={`font-mono font-bold px-2 py-0.5 rounded ${
                              isOverLimit ? 'bg-red-500/20 text-red-300' : 'bg-[#B2FF05]/15 text-[#B2FF05]'
                            }`}>
                              {charCount}/99 תווים
                            </span>
                          </div>

                          <textarea
                            dir="ltr"
                            rows="2"
                            value={ad.headline_es}
                            onChange={e => handleHeadlineChange(ad.uid, e.target.value)}
                            className="w-full bg-[#0B0F14] border border-[#2A3644] focus:border-[#B2FF05] rounded-xl p-2.5 text-sm font-bold text-white leading-snug outline-none resize-none text-left"
                          />

                          <div className="text-xs text-gray-400 bg-[#0E131A] p-2 rounded-lg border border-[#1E2732] leading-relaxed">
                            <span className="text-gray-500 font-bold">תרגום: </span>{ad.headline_he}
                          </div>
                        </div>

                        <div className="pt-2 border-t border-[#1E2732] space-y-2">
                          <div className="flex items-center gap-1.5">
                            <input
                              type="text"
                              value={refineInputs[ad.uid] || ''}
                              onChange={e => setRefineInputs(prev => ({ ...prev, [ad.uid]: e.target.value }))}
                              onKeyDown={e => e.key === 'Enter' && handleRefineCard(ad)}
                              placeholder="בקש תיקון לתמונה או לכותרת..."
                              className="flex-1 min-w-0 bg-[#0B0F14] border border-[#2A3644] focus:border-[#B2FF05] rounded-lg px-2.5 py-1.5 text-[11px] text-white outline-none"
                            />
                            <button
                              onClick={() => handleRefineCard(ad)}
                              disabled={!(refineInputs[ad.uid] || '').trim() || isRefiningThis}
                              className="bg-[#232F3E] hover:bg-[#B2FF05] hover:text-black disabled:opacity-40 text-[#B2FF05] border border-[#B2FF05]/30 px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition-all whitespace-nowrap"
                            >
                              תקן
                            </button>
                            {historyCount > 0 && (
                              <button
                                onClick={() => handleUndoCard(ad.uid)}
                                disabled={isRefiningThis}
                                title="חזור לגרסה שלפני התיקון"
                                className="bg-[#1A232E] hover:bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-1.5 rounded-lg text-[11px] font-bold flex items-center gap-1 transition-all whitespace-nowrap"
                              >
                                <IconUndo />
                                <span>חזור ({historyCount})</span>
                              </button>
                            )}
                          </div>

                          <div className="flex items-center justify-between gap-2">
                            <button
                              onClick={() => handleCopyHeadline(ad.headline_es, ad.uid)}
                              className="flex-1 bg-[#1A232E] hover:bg-[#232F3E] text-gray-200 border border-[#2D3A4B] py-1.5 px-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all"
                            >
                              <IconCopy />
                              <span>{copiedIdx === ad.uid ? 'הועתק!' : 'העתק כותרת'}</span>
                            </button>

                            <button
                              onClick={() => handleDownload(ad.image, idx)}
                              className="flex-1 bg-[#B2FF05] hover:bg-[#a1e604] text-[#0B0F14] py-1.5 px-2.5 rounded-lg text-xs font-black flex items-center justify-center gap-1.5 transition-all"
                            >
                              <IconDownload />
                              <span>הורד תמונה</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [lastUpdatedDisplay, setLastUpdatedDisplay] = useState(null);
      const [selectedCountry, setSelectedCountry] = useState('הכל');
      const [selectedStage, setSelectedStage] = useState('הכל');
      const [sortBy, setSortBy] = useState('interest');
      const [selectedCompany, setSelectedCompany] = useState(null);
      const [activeDisruptiveCompany, setActiveDisruptiveCompany] = useState(null);

      // שורת חיפוש חופשית ("תמצא לי חברה")
      const [aiSearchQuery, setAiSearchQuery] = useState('');
      const [aiSearching, setAiSearching] = useState(false);
      const [aiRecommendation, setAiRecommendation] = useState(null);
      const [aiSearchError, setAiSearchError] = useState('');

      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [triggerStatus, setTriggerStatus] = useState({ state: 'idle', msg: '' });

      async function fetchData() {
        setLoading(true);
        try {
          const response = await fetch(`${supabaseUrl}/rest/v1/latam_companies?select=*&order=id.desc`, {
            headers: {
              'apikey': supabaseKey,
              'Authorization': `Bearer ${supabaseKey}`
            }
          });
          const dbData = response.ok ? await response.json() : [];
          const fetched = Array.isArray(dbData) ? dbData : [];

          if (fetched.length > 0) {
            const newest = fetched.reduce((acc, curr) => {
              const dateVal = curr.updated_at || curr.created_at;
              if (!dateVal) return acc;
              return new Date(dateVal) > new Date(acc) ? dateVal : acc;
            }, fetched[0].updated_at || fetched[0].created_at || new Date().toISOString());

            const dObj = new Date(newest);
            const dateStr = dObj.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = dObj.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
            setLastUpdatedDisplay(`${dateStr} • ${timeStr}`);
          }

          const validCountries = COUNTRIES.map(c => c.id);
          const enrichedDB = fetched
            .filter(item => 
              validCountries.includes(item.country) && 
              !item.name?.toLowerCase().includes('amazon') &&
              !item.name?.toLowerCase().includes('frubana')
            )
            .map(item => {
              const score = parseMediaScore(item.interest_level);
              const computedStage = deriveStage(item);
              const isPublic = !isNonTraded(item);
              const stabilityData = enrichStabilityAndAudience(item, computedStage, isPublic);

              return {
                ...item,
                sector: item.industry || 'פינטק וטכנולוגיה',
                stage: computedStage,
                interest_num: score,
                ...stabilityData,
                driver_type: item.motivation || 'כסף ותשואה (קר)',
                description: item.description || `${item.name} היא חברת ${item.industry || 'טכנולוגיה'} מובילה הפועלת ב${item.country}.`,
                investment_thesis: item.investment_thesis || `החברה נהנית מצמיחה מואצת ב${item.country} ומבססת מעמד מוביל בסקטור.`,
                target_audience: item.target_audience || `משקיעי ריטייל ב${item.country} שמכירים את ${item.name} ומחפשים דרך פשוטה להרוויח מהצמיחה שלה.`
              };
            });

          setData(enrichedDB);
        } catch (err) {
          console.error("Fetch error:", err);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => {
        fetchData();
      }, []);

      const handleAiCompanySearch = async (e) => {
        e.preventDefault();
        if (!aiSearchQuery.trim() || data.length === 0) return;

        setAiSearching(true);
        setAiSearchError('');
        setAiRecommendation(null);

        try {
          const res = await fetch(`${supabaseUrl}/functions/v1/generate-disruptive-ads`, {
            method: 'POST',
            headers: {
              'apikey': supabaseKey,
              'Authorization': `Bearer ${supabaseKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              action: 'recommend_company',
              query: aiSearchQuery.trim(),
              companies: data
            })
          });

          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || 'שגיאה בחיפוש החכם');
          }

          const rec = result.recommendation;
          const matchedCompany = data.find(
            c => String(c.id) === String(rec.company_id) || c.name?.toLowerCase() === rec.company_name?.toLowerCase()
          );

          if (!matchedCompany) {
            throw new Error('לא נמצאה התאמה מדויקת ברשימת החברות הקיימות.');
          }

          setAiRecommendation({
            company: matchedCompany,
            reason: rec.match_reason,
            tags: rec.audience_fit_tags || []
          });
        } catch (err) {
          setAiSearchError(err.message);
        } finally {
          setAiSearching(false);
        }
      };

      const filteredData = useMemo(() => {
        return data
          .filter(item => {
            const matchCountry = selectedCountry === 'הכל' || item.country === selectedCountry;
            const matchStage = selectedStage === 'הכל' || item.stage === selectedStage;
            return matchCountry && matchStage;
          })
          .sort((a, b) => {
            if (sortBy === 'stability') {
              return b.stability_num - a.stability_num;
            }
            return b.interest_num - a.interest_num;
          });
      }, [data, selectedCountry, selectedStage, sortBy]);

      const handleTriggerRefresh = async (e) => {
        e.preventDefault();
        if (!pinInput.trim()) return;

        setTriggerStatus({ state: 'loading', msg: 'מאמת קוד ומזניק סוכן מחקר...' });

        try {
          const res = await fetch(`${supabaseUrl}/functions/v1/trigger-scraper`, {
            method: 'POST',
            headers: {
              'apikey': supabaseKey,
              'Authorization': `Bearer ${supabaseKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ pin: pinInput.trim() })
          });

          const result = await res.json();

          if (!res.ok) {
            setTriggerStatus({ state: 'error', msg: result.error || 'שגיאה בהפעלת הסוכן.' });
            return;
          }

          setTriggerStatus({
            state: 'running',
            msg: 'הסוכן פעיל וסורק כעת 9 מדינות! הטבלה תתרענן אוטומטית בעוד כ-90 שניות...'
          });
          setPinInput('');

          setTimeout(() => {
            fetchData();
            setTriggerStatus({ state: 'done', msg: 'הנתונים עודכנו בהצלחה!' });
            setTimeout(() => {
              setShowPinModal(false);
              setTriggerStatus({ state: 'idle', msg: '' });
            }, 3000);
          }, 95000);

        } catch (err) {
          setTriggerStatus({ state: 'error', msg: `שגיאת תקשורת: ${err.message}` });
        }
      };

      const stageTooltips = {
        'טרנדיות': 'חברות פרטיות או ציבוריות שמייצרות סיקור תקשורתי ורעש ברשת כרגע.',
        'מומנטום': 'חברות שנמצאות במסלול צמיחה עקבי בהכנסות ובגיוסי הון.',
        'לקראת הנפקה': 'חברות פרטיות שקיים לגביהן דיווח רשמי ופומבי על הגשת תשקיף או תכנון IPO קרוב.',
        'אחרי הנפקה': 'חברות טכנולוגיה ופינטק שהונפקו בבורסה ב-3 השנים האחרונות.',
        'חזקות': 'חברות עוגן מבוססות ובורסאיות ותיקות עם נתח שוק משמעותי.'
      };

      return (
        <div className="min-h-screen bg-[#0B0F14] text-gray-200 pb-16">
          <header className="border-b border-[#1E2732] bg-[#0E131A]/90 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <div className="w-3 h-3 rounded-full bg-[#B2FF05] shadow-[0_0_12px_#B2FF05]"></div>
                  <h1 className="text-xl font-black tracking-tight text-white">
                    LATAM <span className="text-[#B2FF05]">INVEST</span> TERMINAL
                  </h1>
                </div>
                <p className="text-xs text-gray-400 mt-1">
                  סקירת שוק ומודיעין עסקי לשווקים מתעוררים באמריקה הלטינית
                </p>
              </div>

              <div className="flex items-center gap-3 flex-wrap">
                <div className="bg-[#131A22] border border-[#232D36] px-3.5 py-2 rounded-xl text-xs flex items-center gap-2 text-gray-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                  <span>עודכן לאחרונה:</span>
                  <span className="font-mono font-bold text-white">{lastUpdatedDisplay || 'טוען...'}</span>
                  <span className="text-gray-500 hidden md:inline">(אוטומציה: כל יום ב׳)</span>
                </div>

                <button 
                  onClick={() => {
                    setTriggerStatus({ state: 'idle', msg: '' });
                    setShowPinModal(true);
                  }}
                  className="bg-[#B2FF05] hover:bg-[#a1e604] text-[#0B0F14] px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition-all shadow-[0_0_15px_rgba(178,255,5,0.2)]"
                >
                  <IconRefresh spin={triggerStatus.state === 'running'} />
                  <span>{triggerStatus.state === 'running' ? 'הסוכן סורק ברקע...' : 'רענן נתונים עכשיו'}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 space-y-5">
            {/* שורת חיפוש חופשית חכמה מעל כפתורי המדינות */}
            <div className="bg-[#11171F] border border-[#232D36] rounded-2xl p-4 shadow-lg space-y-3">
              <form onSubmit={handleAiCompanySearch} className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <label className="text-xs font-black text-[#B2FF05] whitespace-nowrap flex items-center gap-1.5">
                  <IconSparkles />
                  <span>תמצא לי חברה:</span>
                </label>

                <input
                  type="text"
                  value={aiSearchQuery}
                  onChange={e => setAiSearchQuery(e.target.value)}
                  placeholder='לדוגמה: "מה החברה הכי חזקה במקסיקו שמתאימה לקהל מעל 50 עם כסף פנוי ובלי הבנה טכנולוגית גבוהה שמסחר מפחיד אותם"'
                  className="flex-1 bg-[#0B0F14] border border-[#2D3A4B] focus:border-[#B2FF05] rounded-xl px-4 py-2.5 text-xs text-white outline-none placeholder:text-gray-500"
                />

                <button
                  type="submit"
                  disabled={!aiSearchQuery.trim() || aiSearching || loading}
                  className="bg-[#B2FF05] hover:bg-[#a1e604] disabled:opacity-40 text-[#0B0F14] px-5 py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-2 whitespace-nowrap transition-all"
                >
                  <IconSearch />
                  <span>{aiSearching ? 'המוח סורק...' : 'מצא לי מניה'}</span>
                </button>
              </form>

              {aiSearchError && (
                <div className="text-xs text-red-300 bg-red-500/10 border border-red-500/30 rounded-xl px-3.5 py-2">
                  {aiSearchError}
                </div>
              )}

              {aiRecommendation && (
                <div className="bg-[#151E29] border border-[#B2FF05]/40 rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div className="space-y-1.5">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-[11px] font-bold text-[#B2FF05]">המלצת המוח:</span>
                      <span className="text-base font-black text-white">{aiRecommendation.company.name}</span>
                      <span className="text-xs text-gray-400">({aiRecommendation.company.country} • {aiRecommendation.company.stage})</span>
                      <span className="text-[11px] bg-sky-500/15 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-md font-bold">
                        יציבות: {aiRecommendation.company.stability_num}/100
                      </span>
                    </div>
                    <p className="text-xs text-gray-200 leading-relaxed">{aiRecommendation.reason}</p>
                    {aiRecommendation.tags?.length > 0 && (
                      <div className="flex flex-wrap gap-1.5 pt-1">
                        {aiRecommendation.tags.map((t, i) => (
                          <span key={i} className="text-[10px] bg-[#0B0F14] text-gray-300 border border-[#2A3644] px-2 py-0.5 rounded-md">
                            {t}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
                    <button
                      onClick={() => setAiRecommendation(null)}
                      className="text-xs text-gray-400 hover:text-white px-3 py-2 rounded-lg bg-[#1A232E]"
                    >
                      סגור
                    </button>
                    <button
                      onClick={() => setSelectedCompany(aiRecommendation.company)}
                      className="bg-[#B2FF05] hover:bg-[#a1e604] text-[#0B0F14] px-4 py-2 rounded-lg text-xs font-black whitespace-nowrap"
                    >
                      פתח תיק חברה ←
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* כפתורי מדינות */}
            <div className="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar">
              {COUNTRIES.map(country => {
                const count = country.id === 'הכל' 
                  ? data.length 
                  : data.filter(d => d.country === country.id).length;
                
                return (
                  <button
                    key={country.id}
                    onClick={() => setSelectedCountry(country.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center gap-2 border ${
                      selectedCountry === country.id
                        ? 'bg-[#B2FF05] text-[#0B0F14] border-[#B2FF05] font-bold shadow-[0_0_15px_rgba(178,255,5,0.2)]'
                        : 'bg-[#131A22] text-gray-400 border-[#232D36] hover:border-gray-600 hover:text-gray-200'
                    }`}
                  >
                    <span>{country.label}</span>
                    <span className={`px-1.5 py-0.5 rounded-md text-[10px] ${
                      selectedCountry === country.id ? 'bg-black/20 text-black' : 'bg-[#1C2530] text-gray-400'
                    }`}>
                      {count}
                    </span>
                  </button>
                );
              })}
            </div>

            {/* כפתורי שלבים */}
            <div className="flex flex-wrap items-center gap-2 bg-[#11171F] p-4 rounded-2xl border border-[#1E2732]">
              {STAGES.map(stage => {
                const btn = (
                  <button
                    key={stage.id}
                    onClick={() => setSelectedStage(stage.id)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2 border ${
                      selectedStage === stage.id
                        ? 'bg-[#1A232E] text-white border-[#B2FF05]/50 shadow-[0_0_10px_rgba(178,255,5,0.1)]'
                        : 'bg-[#131A22] text-gray-400 border-[#232D36] hover:border-gray-600'
                    }`}
                  >
                    <span className={`w-2 h-2 rounded-full ${stage.color}`}></span>
                    {stage.label}
                  </button>
                );

                return stageTooltips[stage.id] ? (
                  <Tooltip key={stage.id} text={stageTooltips[stage.id]} position="bottom">
                    {btn}
                  </Tooltip>
                ) : btn;
              })}
            </div>

            {/* טבלת החברות */}
            <div className="bg-[#11171F] border border-[#1E2732] rounded-2xl overflow-visible shadow-xl">
              <div className="overflow-x-auto overflow-y-visible">
                <table className="w-full text-right border-collapse">
                  <thead>
                    <tr className="border-b border-[#1E2732] text-gray-400 text-xs bg-[#141B24]">
                      <th className="py-4 px-4 font-medium min-w-[180px]">חברה</th>
                      <th className="py-4 px-3 font-medium whitespace-nowrap">מדינה</th>
                      <th className="py-4 px-3 font-medium min-w-[120px]">סקטור</th>
                      <th className="py-4 px-3 font-medium text-center whitespace-nowrap">
                        <Tooltip text="סיווג החברה" position="bottom">
                          שלב
                        </Tooltip>
                      </th>
                      <th 
                        onClick={() => setSortBy('interest')}
                        className={`py-4 px-3 font-medium whitespace-nowrap cursor-pointer transition-colors ${sortBy === 'interest' ? 'text-[#B2FF05]' : 'hover:text-white'}`}
                      >
                        <Tooltip text="מדד משוקלל (1-100): נוכחות פרסומית, מוכרות מותג ומומנטום חדשותי. לחץ למיון." position="bottom">
                          <span>עניין ומומנטום {sortBy === 'interest' ? '↓' : ''}</span>
                        </Tooltip>
                      </th>
                      <th 
                        onClick={() => setSortBy('stability')}
                        className={`py-4 px-3 font-medium whitespace-nowrap cursor-pointer transition-colors ${sortBy === 'stability' ? 'text-sky-400' : 'hover:text-white'}`}
                      >
                        <Tooltip text="מדד יציבות וביטחון מותגי (1-100): התאמה לקהל בוגר ושמרן שמחפש חברת עוגן בטוחה. לחץ למיון." position="bottom">
                          <span>יציבות וביטחון {sortBy === 'stability' ? '↓' : ''}</span>
                        </Tooltip>
                      </th>
                      <th className="py-4 px-3 font-medium min-w-[110px]">המניע המרכזי</th>
                      <th className="py-4 px-3 font-medium min-w-[150px]">הון שגויס</th>
                      <th className="py-4 px-4 font-medium min-w-[150px]">שווי מוערך</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#1E2732]/60 text-sm">
                    {loading ? (
                      <tr>
                        <td colSpan="9" className="py-16 text-center text-gray-500">טוען נתוני מחקר...</td>
                      </tr>
                    ) : filteredData.length === 0 ? (
                      <tr>
                        <td colSpan="9" className="py-16 text-center text-gray-500">לא נמצאו חברות.</td>
                      </tr>
                    ) : (
                      filteredData.map((company, idx) => {
                        const nonTraded = isNonTraded(company);
                        return (
                          <tr 
                            key={company.id || idx}
                            onClick={() => setSelectedCompany(company)}
                            className="hover:bg-[#17202B] transition-colors cursor-pointer group"
                          >
                            <td className="py-4 px-4">
                              <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-[#1A232E] border border-[#2A3644] flex items-center justify-center font-bold text-xs text-gray-300 group-hover:border-[#B2FF05]/50 group-hover:text-[#B2FF05] transition-colors shrink-0">
                                  {getInitials(company.name)}
                                </div>
                                <div>
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <span className="font-bold text-white group-hover:text-[#B2FF05] transition-colors">
                                      {company.name}
                                    </span>
                                    {nonTraded && (
                                      <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-medium bg-[#18212C] text-gray-400 border border-[#2A3644] whitespace-nowrap">
                                        <span className="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                                        לא נסחרת
                                      </span>
                                    )}
                                  </div>
                                  <div className="text-[11px] text-gray-500 flex items-center gap-1 mt-0.5">
                                    <span className="text-emerald-400">↗</span>
                                    <span>{company.status || 'פרטית • מקור מקומי'}</span>
                                  </div>
                                </div>
                              </div>
                            </td>
                            <td className="py-4 px-3 text-gray-300 text-xs whitespace-nowrap">{company.country}</td>
                            <td className="py-4 px-3 text-gray-400 text-xs leading-snug">{company.sector}</td>
                            <td className="py-4 px-3 text-center whitespace-nowrap">
                              <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${getStageBadge(company.stage)}`}>
                                {company.stage}
                              </span>
                            </td>
                            <td className="py-4 px-3 whitespace-nowrap">
                              <div className="flex items-center gap-2">
                                <span className="font-bold text-white w-6">{company.interest_num}</span>
                                <div className="w-11 h-1.5 bg-[#1E2732] rounded-full overflow-hidden">
                                  <div 
                                    className="h-full bg-[#B2FF05] rounded-full" 
                                    style={{ width: `${Math.min(100, company.interest_num)}%` }}
                                  ></div>
                                </div>
                              </div>
                            </td>
                            <td className="py-4 px-3 whitespace-nowrap">
                              <div className="flex items-center gap-2">
                                <span className="font-bold text-sky-300 w-6">{company.stability_num}</span>
                                <div className="w-11 h-1.5 bg-[#1E2732] rounded-full overflow-hidden">
                                  <div 
                                    className="h-full bg-sky-400 rounded-full" 
                                    style={{ width: `${Math.min(100, company.stability_num)}%` }}
                                  ></div>
                                </div>
                              </div>
                            </td>
                            <td className="py-4 px-3 text-gray-300 text-xs leading-snug">{company.driver_type}</td>
                            <td className="py-4 px-3 text-gray-300 font-mono text-xs max-w-[180px] leading-snug">{company.raised || 'לא פורסם'}</td>
                            <td className="py-4 px-4 font-bold text-white font-mono text-xs max-w-[180px] leading-snug">{company.valuation || 'לא פורסם'}</td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {showPinModal && (
            <div 
              className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
              onClick={() => setShowPinModal(false)}
            >
              <div 
                className="bg-[#0E131A] border border-[#2A3644] rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center justify-between border-b border-[#1E2732] pb-3">
                  <h3 className="text-base font-bold text-white">הפעלת סוכן מחקר AI</h3>
                  <button onClick={() => setShowPinModal(false)} className="text-gray-400 hover:text-white">
                    <IconClose />
                  </button>
                </div>

                <p className="text-xs text-gray-400 leading-relaxed">
                  הזן את קוד הגישה (PIN) כדי להפעיל סריקה חיה של כל 9 המדינות.
                </p>

                <form onSubmit={handleTriggerRefresh} className="space-y-4">
                  <input
                    type="password"
                    value={pinInput}
                    onChange={e => setPinInput(e.target.value)}
                    placeholder="הקלד קוד גישה (PIN)..."
                    className="w-full bg-[#131A22] border border-[#2D3A4B] focus:border-[#B2FF05] rounded-xl px-4 py-2.5 text-sm text-white outline-none text-center font-mono"
                    autoFocus
                  />

                  {triggerStatus.msg && (
                    <div className={`p-3 rounded-xl text-xs leading-relaxed border ${
                      triggerStatus.state === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-300' : 'bg-[#B2FF05]/10 border-[#B2FF05]/30 text-[#B2FF05]'
                    }`}>
                      {triggerStatus.msg}
                    </div>
                  )}

                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowPinModal(false)} className="px-4 py-2 rounded-xl text-xs text-gray-400 bg-[#161E27]">סגור</button>
                    <button type="submit" disabled={triggerStatus.state === 'loading' || triggerStatus.state === 'running'} className="bg-[#B2FF05] text-[#0B0F14] px-5 py-2 rounded-xl text-xs font-bold font-black">הפעל סריקה</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* כרטיס חברה מקוצר וממוקד */}
          {selectedCompany && (
            <div 
              className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto"
              onClick={() => setSelectedCompany(null)}
            >
              <div 
                className="bg-[#0B0F14] border border-[#B2FF05]/40 rounded-2xl max-w-2xl w-full p-6 space-y-3.5 shadow-[0_0_40px_rgba(0,0,0,0.9)] relative my-8 max-h-[90vh] overflow-y-auto"
                onClick={e => e.stopPropagation()}
              >
                {/* כותרת עליונה */}
                <div className="flex items-start justify-between border-b border-[#1E2732] pb-3.5">
                  <button onClick={() => setSelectedCompany(null)} className="text-gray-400 hover:text-white p-1.5 rounded-lg bg-[#161E27]"><IconClose /></button>

                  <div className="text-left">
                    <div className="text-xs text-gray-400 mb-1">פעילות ב{selectedCompany.country} • {selectedCompany.sector}</div>
                    <div className="flex items-center justify-end gap-2 flex-wrap font-black">
                      {isNonTraded(selectedCompany) && (
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#18212C] text-gray-400 border border-[#2A3644]">
                          <span className="w-1.5 h-1.5 rounded-full bg-gray-500"></span>לא נסחרת
                        </span>
                      )}
                      <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium border ${getStageBadge(selectedCompany.stage)}`}>{selectedCompany.stage}</span>
                      <span className="bg-[#B2FF05] text-[#0B0F14] px-3 py-0.5 rounded-lg text-lg font-black">{selectedCompany.name}</span>
                    </div>
                    <div className="text-[11px] text-gray-400 mt-1 font-mono">{selectedCompany.status}</div>
                  </div>
                </div>

                {/* 1. מה היא עושה + שורת נתונים פיננסיים מוקטנת */}
                <div className="bg-[#11171F] border border-[#1E2732] rounded-xl p-3.5 space-y-2.5">
                  <div className="flex items-center gap-2 text-xs text-gray-400 font-medium"><IconBuilding /><span>מה היא עושה</span></div>
                  <p className="text-sm text-gray-200 leading-relaxed">{selectedCompany.description}</p>
                  
                  <div className="pt-2 border-t border-[#1E2732]/80 flex flex-wrap items-center gap-x-5 gap-y-1 text-xs">
                    <div>
                      <span className="text-gray-500">הון שגויס: </span>
                      <span className="font-mono font-bold text-gray-200">{selectedCompany.raised || 'לא פורסם'}</span>
                    </div>
                    <div>
                      <span className="text-gray-500">שווי מוערך: </span>
                      <span className="font-mono font-bold text-[#B2FF05]">{selectedCompany.valuation || 'לא פורסם'}</span>
                    </div>
                  </div>
                </div>

                {/* 2. מה כתבו עליה */}
                <div className="bg-[#11171F] border border-[#1E2732] rounded-xl p-3.5 space-y-2">
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <div className="flex items-center gap-2 text-xs text-gray-400 font-medium"><IconNews /><span>מה כתבו עליה</span></div>
                    <div className="flex items-center gap-2.5">
                      <a href={`https://www.google.com/search?q=${encodeURIComponent(`"${selectedCompany.name}" ${selectedCompany.country} funding valuation`)}`} target="_blank" rel="noopener noreferrer" className="text-[11px] text-gray-300 hover:text-[#B2FF05] flex items-center gap-1 bg-[#18212C] px-2 py-0.5 rounded-md border border-[#2A3644]"><IconSearch /><span>אמת בגוגל</span></a>
                      {selectedCompany.source_url && <a href={selectedCompany.source_url} target="_blank" rel="noopener noreferrer" className="text-[11px] text-[#B2FF05] hover:underline flex items-center gap-1 font-bold"><span>לכתבת המקור</span><IconExternal /></a>}
                    </div>
                  </div>
                  <p className="text-sm text-gray-200 leading-relaxed">{selectedCompany.catalyst}</p>
                </div>

                {/* 3. למה שווה להשקיע */}
                <div className="bg-[#11171F] border border-[#B2FF05]/50 rounded-xl p-3.5 space-y-1.5 shadow-[0_0_20px_rgba(178,255,5,0.04)]">
                  <div className="flex items-center gap-2 text-xs text-[#B2FF05] font-bold"><IconTrendUp /><span>למה שווה להשקיע</span></div>
                  <p className="text-sm text-white leading-relaxed font-medium">{selectedCompany.investment_thesis}</p>
                </div>

                {/* 4. בלוק מאוחד ומצומצם: קהל יעד, שני המדדים והמאפיינים המובנים */}
                <div className="bg-[#11171F] border border-sky-500/30 rounded-xl p-3.5 space-y-2.5">
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <div className="flex items-center gap-2 text-xs text-sky-400 font-bold"><IconUsers /><span>קהל יעד ופרופיל משקיע</span></div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <div className="flex items-center gap-1.5 bg-[#0E141B] px-2.5 py-1 rounded-lg border border-[#1E2732]">
                        <span className="text-[11px] text-gray-400">עניין:</span>
                        <span className="text-xs font-black text-[#B2FF05]">{selectedCompany.interest_num}</span>
                      </div>
                      <div className="flex items-center gap-1.5 bg-[#0E141B] px-2.5 py-1 rounded-lg border border-[#1E2732]">
                        <span className="text-[11px] text-gray-400">יציבות:</span>
                        <span className="text-xs font-black text-sky-300">{selectedCompany.stability_num}</span>
                      </div>
                    </div>
                  </div>

                  <p className="text-sm text-gray-200 leading-relaxed">{selectedCompany.target_audience}</p>

                  <div className="flex flex-wrap gap-1.5 pt-1">
                    <span className="text-[11px] bg-[#0E141B] text-sky-200 border border-sky-500/20 px-2.5 py-1 rounded-lg">
                      • גיל יעד: {selectedCompany.audience_age}
                    </span>
                    <span className="text-[11px] bg-[#0E141B] text-sky-200 border border-sky-500/20 px-2.5 py-1 rounded-lg">
                      • טכנולוגיה: {selectedCompany.tech_literacy}
                    </span>
                    <span className="text-[11px] bg-[#0E141B] text-sky-200 border border-sky-500/20 px-2.5 py-1 rounded-lg">
                      • אופי: {selectedCompany.risk_profile}
                    </span>
                  </div>
                </div>

                {/* 5. כפתורי קריאייטיב בלבד (כפתור ChatGPT בלבן) */}
                <div className="pt-1 flex items-center justify-end gap-2.5 flex-wrap">
                  <a
                    href={buildChatGptMoodBoardUrl(selectedCompany)}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="bg-white hover:bg-gray-100 text-[#0B0F14] px-4 py-2.5 rounded-xl text-xs font-black flex items-center gap-1.5 transition-all shadow-md"
                  >
                    <IconGrid />
                    <span>קולאז' 4 באנרים (ChatGPT)</span>
                  </a>

                  <button
                    onClick={() => setActiveDisruptiveCompany(selectedCompany)}
                    className="bg-[#B2FF05] hover:bg-[#a1e604] text-[#0B0F14] px-4 py-2.5 rounded-xl text-xs font-black flex items-center gap-1.5 transition-all shadow-[0_0_15px_rgba(178,255,5,0.25)]"
                  >
                    <IconSparkles />
                    <span>פוסטים לטאבולה + תמונות הפרעה</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {activeDisruptiveCompany && (
            <DisruptiveStudio 
              company={activeDisruptiveCompany} 
              onClose={() => setActiveDisruptiveCompany(null)} 
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
